<style>
/* Davídkovo městečko
   Vzhled: ilustrovaná mapa městečka a nálepkové karty z dětského časopisu
   (tlustá obrysová linka, posunutý stín, živé barvy). Jedno světlé téma záměrně. */
:root {
  --papir: #EEF6FF;
  --tecka: #D3E5F8;
  --ink: #26244A;
  --karta: #FFFFFF;
  --rajce: #FF6B4A;
  --slunce: #FFC83D;
  --trava: #2FB574;
  --nebe: #3D9BF0;
  --hrozen: #8E6CEF;
  --silnice: #F4EAD8;
  --font: 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
  --pismo: 'Andika', 'Baloo 2', system-ui, sans-serif;
  --emoji: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background-color: var(--papir);
  background-image: radial-gradient(var(--tecka) 2px, transparent 2.6px); background-size: 28px 28px;
  color: var(--ink); font-family: var(--font); font-weight: 600; overflow: hidden;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
button { font-family: inherit; color: var(--ink); cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 4px solid var(--hrozen); outline-offset: 4px; }
.emo { font-family: var(--emoji); line-height: 1; font-weight: 400; }
.pismo { font-family: var(--pismo); font-weight: 700; }

#app { height: 100%; }
.obr { height: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; }

/* společné prvky */
.karta { background: var(--karta); border: 4px solid var(--ink); border-radius: 26px; box-shadow: 6px 6px 0 var(--ink); }
button.karta:active, .kulate:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--ink); }
.kulate { flex: none; width: clamp(54px, 8vmin, 70px); height: clamp(54px, 8vmin, 70px); border-radius: 50%;
  border: 4px solid var(--ink); background: var(--karta); box-shadow: 4px 4px 0 var(--ink);
  font-size: clamp(24px, 4vmin, 32px); display: grid; place-items: center; padding: 0; position: relative; }
.obri-tl { width: clamp(84px, 13vmin, 116px); height: clamp(84px, 13vmin, 116px); font-size: clamp(38px, 6vmin, 54px); }
.play { width: 58%; height: 58%; display: block; margin-left: 8%; }
.dal { background: var(--trava); color: var(--karta); animation: tep 1.6s ease-in-out infinite; }
@keyframes tep { 50% { transform: scale(1.07); } }
.lista { display: flex; align-items: center; gap: 10px; flex: none; }
.bublina { flex: 1; min-width: 0; background: var(--karta); border: 4px solid var(--ink); border-radius: 24px;
  padding: 8px 16px; font-size: clamp(17px, 3vmin, 26px); line-height: 1.25; box-shadow: 4px 4px 0 var(--ink); overflow-wrap: anywhere; }
.bublina.velka { flex: none; width: min(720px, 100%); box-sizing: border-box; font-size: clamp(19px, 3.4vmin, 30px); padding: 14px 22px; }
.rodic.drzim::after { content: ""; position: absolute; inset: -9px; border-radius: 50%; border: 5px solid var(--hrozen); animation: drz 1s linear forwards; }
@keyframes drz { from { opacity: .2; transform: scale(.75); } to { opacity: 1; transform: scale(1); } }
.pocitadlo-nalepek { font-size: 17px; font-weight: 800; position: absolute; bottom: -8px; right: -8px; background: var(--slunce);
  border: 3px solid var(--ink); border-radius: 999px; min-width: 26px; padding: 0 6px; line-height: 22px; font-family: var(--font); }

/* start */
.start { align-items: center; justify-content: center; gap: clamp(16px, 4vmin, 36px); text-align: center; position: relative; }
.start .rodic { position: absolute; top: max(12px, env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); }
.titul { margin: 0; font-size: clamp(44px, 10vmin, 104px); font-weight: 800; line-height: .95; text-wrap: balance; }
.titul .r1 { display: block; color: var(--rajce); }
.titul .r2 { display: block; color: var(--nebe); }
.titul span { -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 4px 5px 0 var(--ink); letter-spacing: .01em; }
.panorama { display: flex; align-items: flex-end; gap: clamp(4px, 1.5vmin, 14px); font-size: clamp(38px, 8vmin, 76px); }
.panorama .emo:nth-child(odd) { transform: translateY(-8px); }
.start-pokrok { font-size: 18px; min-height: 1.4em; }

/* mapa */
.kapitola-chip { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--karta);
  border: 4px solid var(--ink); border-radius: 22px; box-shadow: 4px 4px 0 var(--ink); padding: 6px 14px; }
.kap-nazev { font-size: clamp(18px, 3vmin, 26px); font-weight: 800; white-space: nowrap; }
.sloty-kap { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.slot-kap { width: 30px; height: 30px; border-radius: 50%; border: 3px dashed var(--ink); display: grid; place-items: center; box-sizing: border-box; font-size: 18px; background: var(--papir); }
.slot-kap.plny { border-style: solid; background: var(--slunce); }
.cil-kap { font-size: 30px; margin-left: 4px; }
.mapa { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; border: 4px solid var(--ink); border-radius: 28px; background: var(--karta); -webkit-overflow-scrolling: touch; }
.svet { position: relative; width: 100%; --dum: clamp(96px, 19vw, 138px); }
.cesty { position: absolute; inset: 0 auto auto 0; display: block; }
.cesty path { fill: none; stroke-linecap: round; }
.cesty .okraj { stroke: var(--ink); stroke-width: 34; }
.cesty .silnice { stroke: var(--silnice); stroke-width: 25; }
.cesty .stred { stroke: #FFFFFF; stroke-width: 3; stroke-dasharray: 10 14; }
.cesty .okraj.slepa { stroke-width: 14; opacity: .22; }
.cesty .silnice.slepa { stroke-width: 7; opacity: .5; }
.cesty .stred.slepa { display: none; }
.cesty .okraj.budouci { stroke-width: 8; opacity: .25; stroke-dasharray: 2 16; }
.cesty .silnice.budouci, .cesty .stred.budouci { display: none; }
.dum { position: absolute; transform: translate(-50%, -55%); width: var(--dum); padding: 0; border: 0; background: none;
  display: flex; flex-direction: column; align-items: center; z-index: 2; }
.dum .strecha { width: 112%; height: auto; display: block; margin-bottom: -6px; position: relative; z-index: 1; }
.dum .telo { width: 82%; aspect-ratio: 1.1; background: var(--karta); border: 4px solid var(--ink); border-radius: 0 0 16px 16px;
  box-shadow: 5px 5px 0 var(--ink); display: grid; place-items: center; font-size: calc(var(--dum) * .42); box-sizing: border-box; }
.dum .jmeno { margin-top: 8px; background: var(--karta); border: 3px solid var(--ink); border-radius: 999px; padding: 0 10px;
  font-size: clamp(13px, 1.9vmin, 17px); font-weight: 800; white-space: nowrap; }
.dum .odznak { position: absolute; top: 18%; right: -4%; width: 40px; height: 40px; border-radius: 50%; background: var(--slunce);
  border: 3px solid var(--ink); display: grid; place-items: center; font-size: 22px; z-index: 3; }
.dum.aktivni { animation: pozvi 1.8s ease-in-out infinite; }
.dum.aktivni:nth-of-type(even) { animation-delay: .9s; }
@keyframes pozvi { 0%, 100% { transform: translate(-50%, -55%) scale(1); } 50% { transform: translate(-50%, -58%) scale(1.07); } }
.dum.aktivni:active .telo { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--ink); }
.dum.vybrany { animation: none; transform: translate(-50%, -55%) scale(1.12); }
.dum.slepy { filter: grayscale(1) brightness(1.08); transform: translate(-50%, -55%) scale(.8); pointer-events: none; }
.dum.slepy .telo, .dum.slepy .jmeno { color: #8A88A6; }
.dum.hotovy { pointer-events: none; }
.dum.zamceny { pointer-events: none; filter: grayscale(.5); opacity: .7; }
.uzel { position: absolute; transform: translate(-50%, -50%); width: 78px; height: 78px; border-radius: 50%; background: var(--karta);
  border: 4px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); display: grid; place-items: center; font-size: 42px; z-index: 2; }
.uzel.cil { width: 104px; height: 104px; font-size: 60px; background: var(--slunce); }
.uzel.cil:not(.hotovy) .emo { opacity: .45; filter: grayscale(.6); }
.kap-stitek { position: absolute; left: 50%; transform: translateX(-50%); z-index: 2; background: var(--ink); color: var(--karta);
  border-radius: 999px; padding: 4px 18px; font-size: clamp(17px, 2.6vmin, 22px); font-weight: 800; white-space: nowrap; }
.dekor { position: absolute; transform: translate(-50%, -50%); font-size: clamp(28px, 5vmin, 44px); pointer-events: none; z-index: 1; }
.mlha { position: absolute; transform: translate(-50%, -50%); font-size: 54px; opacity: .85; z-index: 2; pointer-events: none; }
.avatar { position: absolute; transform: translate(-50%, -80%); z-index: 5; display: flex; align-items: flex-end; pointer-events: none; filter: drop-shadow(3px 4px 0 rgba(38, 36, 74, .35)); }
.avatar.jde { transition: left 1s ease-in-out, top 1s ease-in-out; }
.avatar .kluk { font-size: 58px; }
.avatar .pes { font-size: 36px; margin-left: -10px; }

/* úkol */
.uk-postava { flex: none; position: relative; width: clamp(54px, 8vmin, 70px); height: clamp(54px, 8vmin, 70px); border-radius: 50%;
  background: var(--slunce); border: 4px solid var(--ink); display: grid; place-items: center; font-size: clamp(30px, 5vmin, 42px); }
.uk-postava .emo + .emo { position: absolute; bottom: -8px; right: -10px; font-size: 24px; }
.postup { display: flex; justify-content: center; gap: 7px; flex-wrap: wrap; flex: none; min-height: 32px; }
.bod { width: 30px; height: 30px; border-radius: 50%; border: 3px dashed var(--ink); background: var(--karta); display: grid; place-items: center; font-size: 17px; box-sizing: border-box; }
.bod.plny { border-style: solid; background: var(--slunce); animation: pop .4s; }
.stage { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; align-items: center; gap: clamp(14px, 3vmin, 30px); padding: 8px 8px 18px; }
.stage > :first-child { margin-top: auto; }
.stage > :last-child { margin-bottom: auto; }
.uvod-mista { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 22px 40px; position: relative; }
.uvod-mista .obri, .obri { font-size: clamp(90px, 20vmin, 170px); }
.uvod-jmeno { font-size: clamp(22px, 3.6vmin, 32px); font-weight: 800; }
.misto-ikona { position: absolute; top: -22px; right: -22px; font-size: 54px; background: var(--karta); border: 4px solid var(--ink); border-radius: 50%; width: 76px; height: 76px; display: grid; place-items: center; }

.volby { display: flex; gap: clamp(12px, 2.6vmin, 26px); justify-content: center; flex-wrap: wrap; }

<script>
/* Hlas a zvuky.
   Věty jsou předem namluvené neuronovým hlasem (audio/index.json + audio-N.bin).
   Klíč nahrávky = hash(hlas|text), takže stačí změnit text a dogenerovat chybějící.
   Když nahrávka chybí, použije se hlas tabletu (nouzově). */
(function (G) {
  function klic(v, t) {
    const s = v + '|' + t;
    let h = 0x811c9dc5;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
    return h.toString(16).padStart(8, '0');
  }

  const Hlas = { klic, zapnuto: true, stav: { klipu: 0, nacteno: false, chyba: null, hlasy: '' } };
  if (typeof window === 'undefined') { G.Hlas = Hlas; return; }

  let ac = null, master = null, index = null, chunky = [], gen = 0, zdroj = null, ukonciAktualni = null;
  const cache = new Map();
  let ttsHlas = null;

  function najdiTts() {
    if (!('speechSynthesis' in window)) return;
    const v = speechSynthesis.getVoices().filter(x => /^cs/i.test(x.lang));
    ttsHlas = v.find(x => /premium|enhanced|vylepš/i.test(x.name)) || v[0] || null;
  }

      if (ac.state === 'suspended') ac.resume();
      const b = ac.createBuffer(1, 1, 22050), s = ac.createBufferSource();
      s.buffer = b; s.connect(ac.destination); s.start(0);
    } catch (e) {}
  };
  Hlas.ctx = () => ac;
  Hlas.ttsHlas = () => ttsHlas;
  Hlas.vystup = () => master || (ac && ac.destination);

  Hlas.nacti = async function (base = 'audio/') {
    try {
      const r = await fetch(base + 'index.json', { cache: 'no-cache' });
      if (!r.ok) throw new Error('index ' + r.status);

  Hlas.stop = function () {

      for (let i = 0; i < n; i++) x[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
      const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
      s.buffer = b; f.type = 'bandpass'; f.frequency.value = filtr; f.Q.value = 0.9; g.gain.value = hl;

  }

    ok() { ton(660, .16); ton(880, .16, 'triangle', .1); ton(1320, .3, 'triangle', .2); },
    chyba() { ton(300, .2, 'sine', 0, .12); ton(220, .28, 'sine', .13, .1); },
    tuk() { ton(520 + Math.random() * 260, .1, 'triangle', 0, .12); },
    pop() { ton(900, .07, 'sine', 0, .12); ton(1400, .06, 'sine', .04, .08); },
    krok() { ton(420, .06, 'sine', 0, .06); },
    fanfara() { [523, 659, 784, 1047, 1319].forEach((f, i) => ton(f, .32, 'triangle', i * .12)); },

    buben() {

<script>
/* Davídkovo městečko – jádro aktivit.
   Úkol u domečku = mise z 6–8 kol, každé kolo je jiná AKTIVITA (počítání, pexeso, bludiště…).

   Registrace aktivity:
     U.akt('id', {
       nazev:  'Pexeso',                 // pro rodiče
       obor:   'mat' | 'jazyk' | 'svet' | 'hra',
       velka:  true,                     // celé kolo je delší hra (pexeso, bludiště) – max. 2 v jedné misi
       urovne: [{ t: 1, ...parametry }, { t: 3, ... }],   // t = od které kapitoly (1–6) je úroveň dostupná
       gen(c)       → kolo r = { zadani: 'věta' | ['věty'], ok?: 'věta po úspěchu', rada?: 'nápověda', ... }
       render(c, r) → vykreslí kolo do c.stage (může být async)
     })

   Kontext c (dostane gen i render):
     c.stage            prvek, kam se kreslí
     c.L, c.lvl, c.tier parametry úrovně, index úrovně, kapitola 1–6
     c.misto            místo z data.js (c.misto.veci = názvy věcí typických pro místo)
     c.prog             uložený postup (c.prog.pismena = kolik písmenek už zná)
     c.vyberNove(pool, klicFn)   náhodný výběr bez nedávného opakování
     c.rekni(text|[texty]) → Promise   řekne a zobrazí v bublině
     c.rekniKratce(text)                řekne bez zápisu do bubliny (čísla při počítání…)
     c.spravne(okText, prvek)           kolo splněno (pochvala, konfety, další kolo) – volat jednou
     c.spatne(prvek, rada, hnedText)    chyba (zatřese prvkem, povzbudí; od 2. chyby řekne radu)
     c.zamceno()        true = kolo už skončilo, ignoruj ťuknutí
     c.aktivni()        false = hráč odešel / kolo se změnilo (kontroluj v časovačích)
     c.cekej(ms)        Promise
   Pomocníci: U.h (níže) a U.pomoc (rnd, vyber, zamichej, cap, N, Nc, V). */
(function (G) {
  const DB = G.DB;
  const U = { akty: {} };
  U.akt = (id, def) => { def.id = id; U.akty[id] = def; };

  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const vyber = a => a[Math.floor(Math.random() * a.length)];
  const zamichej = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const N = n => DB.cisla[n] || String(n), Nc = n => cap(N(n));
  const V = n => DB.vec[n];
  const toJe = v => (v.pl ? `To jsou ${v.n}!` : `To je ${v.n}!`);
  const kdeJe = v => (v.pl ? `Kde jsou ${v.n}?` : `Kde je ${v.n}?`);
  U.pomoc = { rnd, vyber, zamichej, cap, N, Nc, V, toJe, kdeJe };

  /* ---------- DOM ---------- */
  function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  const E = (e, cls = '') => `<span class="emo ${cls}">${e}</span>`;
  function tl(cls, html, aria) { const b = el('button', cls, html); b.type = 'button'; if (aria) b.setAttribute('aria-label', aria); return b; }
  const tecky = v => `<span class="tecky">${'<i></i>'.repeat(v)}</span>`;
  function hop(b) { b.classList.remove('hop'); void b.offsetWidth; b.classList.add('hop'); }
  function vrt(b) { b.classList.remove('vrt'); void b.offsetWidth; b.classList.add('vrt'); }

  // Řada karet k ťuknutí; správná dostane data-ok (po 3. chybě se rozbliká jako nápověda).
  function volby(c, moznosti, { trida = 'volby', ok, rada } = {}) {
    const w = el('div', trida);
    moznosti.forEach(m => {
      const b = tl('karta volba ' + (m.cls || ''), m.html, m.aria);
      if (m.spravne) b.dataset.ok = '1';
      b.onclick = () => {
        if (c.zamceno()) return;
        if (m.spravne) { b.classList.add('ok'); if (m.poOk) m.poOk(b); c.spravne(ok, b); }
        else c.spatne(b, rada);
      };
      w.appendChild(b);
    });
    c.stage.appendChild(w);
    return w;
  }
  function moznostiCisel(spravna, max, pocet = 3, min = 1) {
    const hi = Math.max(min + pocet - 1, max), k = [];
    for (let i = min; i <= hi; i++) if (i !== spravna) k.push({ v: i, s: Math.abs(i - spravna) + Math.random() * 0.9 });
    k.sort((a, b) => a.s - b.s);
    return [spravna, ...k.slice(0, pocet - 1).map(x => x.v)].sort((a, b) => a - b);
  }
  function cisla(c, spravna, max, { tecky: t, ok, rada, pocet = 3, poOk, min = 1 } = {}) {
    return volby(c, moznostiCisel(spravna, max, pocet, min).map(v => ({
      html: `<span class="cif">${v}</span>` + (t ? tecky(v) : ''), aria: String(v), spravne: v === spravna, poOk,
    })), { trida: 'volby cisla', ok, rada });
  }
  // Obrázky, které jde ťukáním počítat (každé ťuknutí řekne další číslo).
  function pocitadlo(kam, e, n, c, citac = { n: 0 }, cls = 'kus') {
    const out = [];
    for (let i = 0; i < n; i++) {
      const b = tl(cls, E(e), 'obrázek');
      b.style.setProperty('--rot', rnd(-12, 12) + 'deg');
      b.onclick = () => {
        hop(b);
        if (b.dataset.c) return;
        citac.n++; b.dataset.c = citac.n; b.appendChild(el('span', 'znacka', String(citac.n)));
        G.Zvuk.tuk(); c.rekniKratce(Nc(citac.n));
      };
      kam.appendChild(b); out.push(b);
    }
    return out;
  }
  function veciMista(c, kat = 'ovoce') {
    const p = ((c.misto && c.misto.veci) || []).map(V).filter(v => v && v.g);
    return p.length ? p : DB.VECI.filter(v => v.k === kat && v.g);
  }

  /* Táhnutí prstem (funguje i ťuknutím: ťuknout na věc, pak na cíl).
     tahni(c, prvek, cile, kam):  cile = pole prvků nebo funkce vracející pole,
     kam(cil, prvek) → true (přijato; volající si prvek přesune) | false (vrátí se zpět). */
  let vybranyTah = null;
  function tahni(c, prvek, cile, kam) {
    const seznam = () => (typeof cile === 'function' ? cile() : cile);
    prvek.classList.add('tahatko');
    prvek.style.touchAction = 'none';
    const pod = (x, y) => seznam().find(t => { const r = t.getBoundingClientRect(); return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom; });
    prvek.addEventListener('pointerdown', e => {
      if (c.zamceno() || prvek.dataset.hotovo) return;
      e.preventDefault();
      const r = prvek.getBoundingClientRect(), sx = e.clientX, sy = e.clientY;
      let duch = null, nad = null;
      const pohyb = ev => {
        const dx = ev.clientX - sx, dy = ev.clientY - sy;
        if (!duch && Math.hypot(dx, dy) > 8) {
          duch = prvek.cloneNode(true); duch.classList.add('duch');
          Object.assign(duch.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
          document.body.appendChild(duch); prvek.classList.add('tazeny');
        }
        if (duch) {
          duch.style.transform = `translate(${dx}px, ${dy}px) scale(1.08)`;
          const t = pod(ev.clientX, ev.clientY);
          if (t !== nad) { if (nad) nad.classList.remove('nad'); if (t) t.classList.add('nad'); nad = t; }
        }
      };
      const konec = ev => {
        window.removeEventListener('pointermove', pohyb); window.removeEventListener('pointerup', konec); window.removeEventListener('pointercancel', konec);
        if (nad) nad.classList.remove('nad');
        if (!duch) {   // ťuknutí: vybrat
          document.querySelectorAll('.tahatko.vybrany').forEach(x => x.classList.remove('vybrany'));
          vybranyTah = { prvek, kam, seznam }; prvek.classList.add('vybrany'); G.Zvuk.pop();
          return;
        }
        duch.remove(); prvek.classList.remove('tazeny');
        const t = pod(ev.clientX, ev.clientY);
        if (t && !c.zamceno()) { if (!kam(t, prvek)) vrt(prvek); }
      };
      window.addEventListener('pointermove', pohyb); window.addEventListener('pointerup', konec); window.addEventListener('pointercancel', konec);
    });
  }
  // Cíl pro režim „ťukni věc, ťukni cíl“
  function cil(c, t) {
    t.classList.add('cil-tahu');
    t.addEventListener('click', () => {
      if (!vybranyTah || c.zamceno() || !vybranyTah.seznam().includes(t)) return;

    });
  }

  function tvarSvg(id, hex) {
    const st = `fill="${hex}" stroke="#26244A" stroke-width="5" stroke-linejoin="round"`;
    let s = '';
    if (id === 'kruh') s = `<circle cx="50" cy="50" r="40" ${st}/>`;
    if (id === 'ctverec') s = `<rect x="13" y="13" width="74" height="74" rx="3" ${st}/>`;
    if (id === 'trojuhelnik') s = `<polygon points="50,9 93,87 7,87" ${st}/>`;
    if (id === 'obdelnik') s = `<rect x="4" y="26" width="92" height="48" rx="3" ${st}/>`;
    if (id === 'hvezda') {
      const b = []; for (let i = 0; i < 10; i++) { const r = i % 2 ? 19 : 45, a = -Math.PI / 2 + i * Math.PI / 5; b.push((50 + r * Math.cos(a)).toFixed(1) + ',' + (54 + r * Math.sin(a)).toFixed(1)); }
      s = `<polygon points="${b.join(' ')}" ${st}/>`;
    }
    if (id === 'srdce') s = `<path d="M50 89 C20 67 6 51 6 33 C6 19 17 10 29 10 C39 10 46 16 50 24 C54 16 61 10 71 10 C83 10 94 19 94 33 C94 51 80 67 50 89Z" ${st}/>`;
    return `<svg viewBox="0 0 100 100" class="tvar" aria-hidden="true">${s}</svg>`;
  }
  function balonek(hex) {
    return `<svg viewBox="0 0 60 96" class="balon" aria-hidden="true"><path d="M30 64 q-6 12 2 30" fill="none" stroke="#26244A" stroke-width="2.5"/>` +
      `<ellipse cx="30" cy="31" rx="25" ry="30" fill="${hex}" stroke="#26244A" stroke-width="3.5"/>` +
      `<path d="M25 60 h10 l-5 7z" fill="${hex}" stroke="#26244A" stroke-width="2.5" stroke-linejoin="round"/>` +
      `<ellipse cx="20" cy="19" rx="5" ry="9" fill="#fff" opacity=".5"/></svg>`;
  }
  const adjAcc = (s, rod) => s + (rod === 'm' ? 'ý' : rod === 'n' ? 'é' : 'ou');
  const adjNom = (s, rod) => s + (rod === 'm' ? 'ý' : rod === 'n' ? 'é' : 'á');

  U.h = { el, E, tl, tecky, hop, vrt, volby, moznostiCisel, cisla, pocitadlo, veciMista, tahni, cil, tvarSvg, balonek, adjAcc, adjNom, znamaPismena };

</script>
<script>
/* Davídkovo městečko – základní aktivity (počítání, poznávání, písmenka…). API viz jadro.js. */
(function (G) {
  const { DB, U } = G;
  const { rnd, vyber, zamichej, cap, N, Nc, V, toJe, kdeJe } = U.pomoc;
  const { el, E, tl, tecky, hop, volby, moznostiCisel, cisla, pocitadlo, veciMista, tvarSvg, balonek, adjAcc, adjNom, znamaPismena } = U.h;
  const RADA_POCITANI = 'Ťukni prstíkem na každý obrázek a počítej se mnou.';

  // rozmístí prvky volně po scéně (jako v časopise), bez překryvů
  function rozhod(scena, prvky) {
    const cols = prvky.length > 8 ? 5 : 4, rows = Math.ceil(Math.max(prvky.length, 6) / cols) + 1;
    const bunky = zamichej(Array.from({ length: cols * rows }, (_, i) => i)).slice(0, prvky.length);
    prvky.forEach((p, i) => {
      const b = bunky[i], x = b % cols, y = Math.floor(b / cols);
      p.style.left = ((x + 0.5) / cols * 100 + rnd(-5, 5)) + '%';
      p.style.top = ((y + 0.5) / rows * 100 + rnd(-6, 6)) + '%';
      p.classList.add('z-volny');
      scena.appendChild(p);
    });
  }

  /* ===== MATIKA ===== */
  U.akt('pocitani', {
    nazev: 'Počítání', obor: 'mat',
    urovne: [{ t: 1, min: 2, max: 5, tecky: true }, { t: 2, min: 3, max: 7, tecky: true },
      { t: 3, min: 2, max: 8, jine: 1 }, { t: 4, min: 3, max: 10, jine: 2 }],
    gen(c) {
      const pool = veciMista(c);
      const v = c.vyberNove(pool, x => x.n);
      const n = c.vyberNove(Array.from({ length: c.L.max - c.L.min + 1 }, (_, i) => i + c.L.min), x => 'n' + x);
      const jine = zamichej(DB.VECI.filter(x => x.g && x !== v && x.k !== 'telo')).slice(0, c.L.jine || 0).map(x => ({ v: x, n: rnd(1, 4) }));
      return { v, n, jine, zadani: jine.length ? `Kolik je tu jen ${v.g}? Ty ostatní nepočítej.` : `Kolik je tu ${v.g}?`, ok: Nc(n) + '!', rada: RADA_POCITANI };
    },
    render(c, r) {
      const sc = el('div', 'karta z-scena'); c.stage.appendChild(sc);
      const citac = { n: 0 };
      const moje = pocitadlo(document.createElement('div'), r.v.e, r.n, c, citac);
      const cizi = r.jine.flatMap(j => Array.from({ length: j.n }, () => { const b = tl('kus z-cizi', E(j.v.e), j.v.n); b.onclick = () => { hop(b); G.Zvuk.pop(); }; return b; }));
      rozhod(sc, zamichej([...moje, ...cizi]));
      cisla(c, r.n, c.L.max, { tecky: c.L.tecky, ok: r.ok, rada: r.rada, pocet: r.jine.length ? 4 : 3 });
    },
  });

  U.akt('vic', {
    nazev: 'Kde je víc?', obor: 'mat',
    urovne: [{ t: 1, rozd: 2, max: 6, mene: 0.25 }, { t: 2, rozd: 1, max: 8, mene: 0.4 }, { t: 4, rozd: 1, max: 10, mene: 0.5 }],
    gen(c) {

      const mene = Math.random() < c.L.mene;
      const v = c.vyberNove(veciMista(c), x => x.n);
      const cil = mene ? a : b, jina = mene ? b : a;
      return { v, a, b, mene, cil, zadani: mene ? `Kde je méně ${v.g}?` : `Kde je víc ${v.g}?`,
        ok: `${Nc(cil)} je ${mene ? 'méně' : 'víc'} než ${N(jina)}.`, rada: 'Zkus to spočítat prstíkem.' };
    },
    render(c, r) {
      const w = el('div', 'porovnej');
      zamichej([r.a, r.b]).forEach(n => {
        const m = tl('karta miska', '', String(n));
        if (n === r.cil) m.dataset.ok = '1';
        const p = el('span', 'pocet', String(n)); p.hidden = true;
        m.append(el('div', 'miska-obsah', E(r.v.e).repeat(n)), p);
        m.onclick = () => {
          if (c.zamceno()) return;
          if (n === r.cil) { w.querySelectorAll('.pocet').forEach(x => { x.hidden = false; }); m.classList.add('ok'); c.spravne(r.ok, m); }
          else c.spatne(m, r.rada);
        };
        w.appendChild(m);
      });
      c.stage.appendChild(w);
    },
  });

  U.akt('cislice', {
    nazev: 'Číslice', obor: 'mat',
    urovne: [{ t: 1, max: 5, n: 3 }, { t: 2, max: 7, n: 4 }, { t: 3, max: 10, n: 4 }],
    gen(c) {
      const n = c.vyberNove(Array.from({ length: c.L.max }, (_, i) => i + 1), x => 'c' + x);
      const kde = vyber(['na hasičském autě', 'na dveřích', 'na balónku', 'na dresu']);
      return { n, zadani: `Najdi číslo ${N(n)}.`, ok: Nc(n) + '!', rada: 'Podívej se pořádně na tvar čísla.', kde };
    },
    render(c, r) {
      volby(c, zamichej(moznostiCisel(r.n, c.L.max, c.L.n)).map(v => ({ html: `<span class="cif velka">${v}</span>`, aria: String(v), spravne: v === r.n,
        poOk: b => b.insertAdjacentHTML('beforeend', tecky(v)) })), { trida: 'volby cisla', ok: r.ok, rada: r.rada });
    },
  });

  U.akt('scitani', {
    nazev: 'Sčítání', obor: 'mat',
    urovne: [{ t: 2, max: 5, tecky: true }, { t: 3, max: 7, tecky: false }, { t: 5, max: 10, tecky: false }],

     5) KOSTKY – kolik teček?
     ===================================================================== */
  const ROZLOZENI = { 1: [5], 2: [3, 7], 3: [3, 5, 7], 4: [1, 3, 7, 9], 5: [1, 3, 5, 7, 9], 6: [1, 3, 4, 6, 7, 9] };
  function kostka(n, tag = 'div') {
    const k = document.createElement(tag); k.className = 'm-kostka';
    if (tag === 'button') { k.type = 'button'; k.setAttribute('aria-label', String(n)); }
    nastavKostku(k, n);
    return k;
  }
  function nastavKostku(k, n) {
    k.dataset.n = n;
    k.innerHTML = rozsah(1, 9).map(i => `<span class="m-pole">${ROZLOZENI[n].includes(i) ? '<i class="m-oko"></i>' : ''}</span>`).join('');
  }
  async function hod(c, k, n, ms = 700) {
    k.classList.add('m-hazi');
    const konec = Date.now() + ms;
    while (Date.now() < konec) {
      if (!c.aktivni()) return false;
      nastavKostku(k, rnd(1, 6)); if (Z().tuk) Z().tuk();
      await ceka(c, 90);
    }
    nastavKostku(k, n); k.classList.remove('m-hazi');
    return true;
  }
  // ťuknutí na kostku rozsvítí další tečku a řekne číslo (pomůcka k počítání)
  function pocitejOka(c, kostky) {
    const citac = { n: 0 };
    kostky.forEach(k => {
      k.addEventListener('click', () => {
        if (c.zamceno() || k.classList.contains('m-hazi') || k.classList.contains('m-zakryta')) return;
        const o = [...k.querySelectorAll('.m-oko:not(.m-spocitane)')][0];
        if (!o) { hop(k); return; }
        citac.n++; o.classList.add('m-spocitane'); o.textContent = citac.n;
        if (Z().tuk) Z().tuk(); c.rekniKratce(Nc(citac.n));
      });
    });
  }
  U.akt('kostky', {
    nazev: 'Hrací kostky', obor: 'mat', zadost: 'Zahrajeme si s kostkami?',
    urovne: [{ t: 1, typ: 'kolik' }, { t: 2, typ: 'blik' }, { t: 4, typ: 'dve' }, { t: 3, typ: 'najdi' }],

        return { n, kostky: zamichej([n, ...jine]), zadani: [`Najdi kostku, která má ${tecek(n)}.`],

      }
      return { n, zadani: t === 'blik' ? ['Dívej se pozorně! Kostka se hned schová.', 'Kolik na ní bylo teček?'] : ['Hodím kostkou.', 'Kolik teček padlo?'],
        ok: [t === 'blik' ? jeTecek(n).replace('Je tam', 'Byla tam').replace('Jsou tam', 'Byly tam').replace(/^Byla tam (\S+) teček/, 'Bylo tam $1 teček') : jeTecek(n)], rada: t === 'blik' ? 'Ťukni na kostku a podívej se znovu.' : 'Ťukej na tečky a počítej se mnou.' };
    },
    async render(c, r) {
      const t = c.L.typ;
      const stul = el('div', 'm-stul');
      c.stage.appendChild(stul);
      if (t === 'najdi') {
        const w = el('div', 'm-kostky-volby');
        r.kostky.forEach((n, i) => {
          const k = kostka(n, 'button'); k.classList.add('m-vol');
          k.style.setProperty('--rot', (i % 2 ? 6 : -6) + 'deg');

            if (c.zamceno()) return;

          };
          w.appendChild(k);
        });
        stul.appendChild(w);
        return;
      }
      const hodnoty = t === 'dve' ? [r.a, r.b] : [r.n];
      const kk = hodnoty.map(() => kostka(1));
      kk.forEach((k, i) => { k.style.setProperty('--rot', (i ? 7 : -5) + 'deg'); stul.appendChild(k); });
      const max = t === 'dve' ? 10 : 6, min = t === 'dve' ? 2 : 1;
      const volby = karticky(c, blizka(r.n, min, max, t === 'dve' ? 4 : 3), r.n, (v, b) => c.spravne(r.ok, b), { rada: r.rada });
      volby.classList.add('m-skryte');
      c.stage.appendChild(volby);
      const hody = await Promise.all(kk.map((k, i) => hod(c, k, hodnoty[i], 650 + i * 250)));
      if (!hody.every(Boolean) || !c.aktivni()) return;
      volby.classList.remove('m-skryte');
      if (t === 'blik') {
        const k = kk[0];
        let blik = false;
        const schovej = async () => {
          blik = true;
          k.classList.remove('m-zakryta');
          await ceka(c, 1500);
          blik = false;
          if (c.aktivni()) k.classList.add('m-zakryta');
        };
        k.addEventListener('click', () => { if (!c.zamceno() && !blik) schovej(); });
        k.setAttribute('role', 'button');
        schovej();
      } else pocitejOka(c, kk);
    },
  });

  /* =====================================================================
     6) VĚTŠÍ / MENŠÍ
     ===================================================================== */
  U.akt('vetsi', {
    nazev: 'Větší, nebo menší?', obor: 'mat', zadost: 'Poznáš, které číslo je větší?',
    urovne: [{ t: 3, tecky: true, mene: 0 }, { t: 5, tecky: false, mene: 0.5 }],
    gen(c) {
      const pary = [];

      const [a, b] = c.vyberNove(pary, p => 'p' + p.join('-'));
      const mene = Math.random() < c.L.mene;

      const kdo = mene ? { e: '🐭', t: 'Myška má malé bříško. Chce menší číslo.' } : { e: '🐊', t: 'Krokodýl má hlad. Chce větší číslo.' };
      return { a, b, mene, cil, kdo,
        zadani: [kdo.t, mene ? 'Které číslo je menší?' : 'Které číslo je větší?'],
        ok: [`${Nc(cil)} je ${mene ? 'menší' : 'větší'} než ${N(jina)}.`],
        rada: mene ? 'Menší číslo má méně teček. Kde je jich míň?' : 'Větší číslo má víc teček. Kde je jich víc?' };
    },
    render(c, r) {
      const w = el('div', 'm-vetsi');
      const poradi = zamichej([r.a, r.b]);

        const b = tl('karta volba m-cislo-karta', `<span class="cif velka">${n}</span>` + (c.L.tecky ? tecky(n) : '<span class="m-skryte-tecky">' + tecky(n) + '</span>'), String(n));
        if (n === r.cil) b.dataset.ok = '1';
        b.onclick = () => {
          if (c.zamceno()) return;
          if (n === r.cil) {
            b.classList.add('ok');
            tvor.classList.add(i === 0 ? 'm-doleva' : 'm-doprava', 'm-ham');
            ton(260, 110, .2, 'square', .1, 0, 700);
            c.spravne(r.ok, b);
          } else {
            if (!c.L.tecky) w.classList.add('m-ukaz-tecky');   // po chybě se objeví tečky jako pomůcka
            c.spatne(b, r.rada);
          }
        };
        return b;
      });
      w.append(karty[0], tvor, karty[1]);
      c.stage.appendChild(w);
    },
  });
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* Davídkovo městečko – aktivity HRY (paměť, logika, obratnost).
   pexeso · cochybi · bludiste · puzzle · rozdily · simon · chytani
   Všechny třídy CSS mají předponu h- (css/akt-hry.css). */
(function (G) {
  const DB = G.DB, U = G.U;
  if (!U || !U.akt) return;
  const { el, tl, hop, vrt, veciMista, znamaPismena } = U.h;
  const { rnd, vyber, zamichej, N, Nc, toJe } = U.pomoc;
  const Z = () => G.Zvuk || {};
  const zvuk = (co) => { try { const z = Z(); if (z[co]) z[co](); } catch (e) {} };

  /* ---------- společné ---------- */
  const OBRAZKOVE = DB.VECI.filter(v => ['ovoce', 'zelenina', 'zvire', 'doprava', 'sladke', 'priroda', 'vec'].includes(v.k) && v.g);
  const BAREVNE = DB.VECI.filter(v => ['ovoce', 'zelenina', 'doprava', 'sladke'].includes(v.k) && v.g);

  function mistoKlic(c) {
    const m = c.misto || {};
    let id = m.id || '';
    if (!id && DB.MISTA) id = Object.keys(DB.MISTA).find(k => DB.MISTA[k] === m) || '';
    return (id + ' ' + (m.nazev || '')).toLowerCase();
  }
  // věci typické pro místo (jen ty s obrázkem v DB.VECI)
  function veciTady(c) {
    const jm = (c.misto && c.misto.veci) || [];
    return OBRAZKOVE.filter(v => jm.includes(v.n));
  }
  // vybere n různých věcí; přednostně (asi polovinu) z místa, zbytek z poolu
  function vyberVeci(c, n, pool = OBRAZKOVE, kolikMista = Math.ceil(n / 2)) {
    const out = [], ma = e => out.some(x => x.e === e.e);
    const tady = veciTady(c).filter(v => pool.includes(v));
    while (out.length < Math.min(kolikMista, tady.length)) {
      const z = tady.filter(v => !ma(v)); if (!z.length) break;
      out.push(c.vyberNove(z, x => 'h:' + x.n));
    }
    while (out.length < n) {
      const z = pool.filter(v => !ma(v)); if (!z.length) break;
      out.push(c.vyberNove(z, x => 'h:' + x.n));
    }
    return zamichej(out);
  }
  const oslov = (s) => (Math.random() < 0.3 ? s.replace(/^([^,!.?]+)/, '$1, Davídku') : s);
  const root = (c, cls) => { const r = el('div', 'h-hra ' + cls); c.stage.appendChild(r); return r; };

  // jemné tóny (vlastní WebAudio), když je zvuk odemčený
  function ton(f, d = 0.4, typ = 'triangle', hl = 0.2) {
    try {
      const ac = G.Hlas && G.Hlas.ctx && G.Hlas.ctx(); if (!ac) return;
      const out = G.Hlas.vystup(), t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
      o.type = typ; o.frequency.value = f;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(hl, t + 0.02); g.gain.exponentialRampToValueAtTime(0.001, t + d);
      o.connect(g).connect(out); o.start(t); o.stop(t + d + 0.05);
    } catch (e) {}
  }
  // přesune nápovědu (data-ok + případné blikání) na nový prvek
  function nastavOk(scope, prvek) {
    const blika = !!scope.querySelector('.napoveda');
    scope.querySelectorAll('[data-ok]').forEach(x => { delete x.dataset.ok; x.classList.remove('napoveda'); });
    if (prvek) { prvek.dataset.ok = '1'; if (blika) prvek.classList.add('napoveda'); }
  }

  /* =====================================================================
     1) PEXESO
     ===================================================================== */
  U.akt('pexeso', {
    nazev: 'Pexeso', obor: 'hra', velka: true,
    zadost: 'Zahraješ si se mnou pexeso?',
    urovne: [{ t: 1, pary: 3 }, { t: 2, pary: 4 }, { t: 4, pary: 6 }],

      const [cl, rl, cp, rp] = p === 3 ? [3, 2, 2, 3] : p === 4 ? [4, 2, 2, 4] : [4, 3, 3, 4];
      return { karty, cl, rl, cp, rp, zadani: [oslov('Najdi dvojice stejných obrázků.'), 'Ťukni na dvě kartičky.'],
        ok: ['Našel jsi všechny dvojice!'], rada: 'Zkus si zapamatovat, kde který obrázek byl.' };
    },

            setTimeout(() => {

  });

  /* =====================================================================
     2) CO ZMIZELO?
     ===================================================================== */

      if (!c.aktivni()) return;
      cas.style.visibility = 'hidden';

      if (!c.aktivni()) return;

      c.rekni(r.otazka);
      const w = el('div', 'volby h-zm-volby');

            c.spravne(r.ok, b);

      });

    },

     3) BLUDIŠTĚ

    { h: '🐰', c: '🥕', z: 'Pomoz zajíčkovi k mrkvi.', ok: 'Zajíček má mrkev!', m: /zahrad|zelinar|farm|les/ },
    { h: '🐝', c: '🌻', z: 'Pomoz včelce ke slunečnici.', ok: 'Včelka doletěla ke kytičce!', m: /vcel|zahrad|park|malir/ },
    { h: '🐸', c: '🪷', z: 'Pomoz žabce k leknínu.', ok: 'Žabka sedí na leknínu!', m: /zab|jezir|pristav|rybar|kasn/ },
    { h: '🐶', c: '🦴', z: 'Pomoz pejskovi ke kostičce.', ok: 'Pejsek má kostičku!', m: /hrist|hasic|skolk|park/ },
    { h: '👸', c: '🦄', z: 'Pomoz princezně k jednorožci.', ok: 'Princezna je u jednorožce!', m: /hrad|kral|vez|divadl/ },

    { h: '🐿️', c: '🌰', z: 'Pomoz veverce k oříšku.', ok: 'Veverka má oříšek!', m: /les|park|hajov/ },

    { h: '🐜', c: '🍃', z: 'Pomoz mravenečkovi k lístečku.', ok: 'Mraveneček má lísteček!', m: /mraven|les/ },

      R.append(pole, znovu);

        c.spatne(b, r.rada);

        if (!c.aktivni()) return;

      if (!c.aktivni()) return;

  });

  /* =====================================================================
     7) CHYTÁNÍ
     ===================================================================== */
  const BAL_BARVY = ['cervena', 'modra', 'zluta', 'zelena', 'fialova', 'oranzova', 'ruzova'];
  const PADANI = {
    ovoce: [['🍓', 'jahody'], ['🍎', 'jablíčka'], ['🍌', 'banány'], ['🍐', 'hrušky'], ['🍊', 'pomeranče'], ['🍒', 'třešně']],

        const sk = /rybar|akvar|pristav|zab|kachn|lod|jezir/.test(k) ? 'voda' : /cukrar|zmrzl|pekar|pout/.test(k) ? 'sladke'
          : /les|park|hajov|sov|mraven/.test(k) ? 'priroda' : /hrad|kral|vez|drak|post/.test(k) ? 'poklad' : vyber(Object.keys(PADANI));
        const sada = PADANI[Math.random() < 0.75 ? sk : vyber(Object.keys(PADANI))];
        const x = c.vyberNove(sada, y => 'ch:' + y[0]);
        cil = { typ: 'vec', e: x[0] };
        cizi = sada.filter(y => y !== x).map(y => ({ typ: 'vec', e: y[0] }));
        zadani = `Chytej jen ${x[1]}!`; rada = `Jen ${x[1]}!`;
      } else if (rezim === 'pismeno') {
        const zn = znamaPismena(c);

      } else {
        const d = c.vyberNove([1, 2, 3, 4, 5, 6, 7, 8, 9], y => 'ch:' + y);

        cizi = zamichej([1, 2, 3, 4, 5, 6, 7, 8, 9].filter(y => y !== d)).slice(0, 4).map(y => ({ typ: 'znak', t: String(y), cislo: true }));
        zadani = `Chytej jen číslo ${N(d)}!`; rada = `Jen číslo ${N(d)}!`;
      }
      const nahoru = cil.typ !== 'vec';
      return { rezim, cil, cizi, nahoru, cel: 5, zadani: [oslov(zadani)], ok: ['Chytil jsi jich pět!'], rada };
    },
    render(c, r) {
      const R = root(c, 'h-chyt-hra');
      const kresli = (x) => x.typ === 'balon' ? U.h.balonek(x.hex) : x.typ === 'vec' ? `<span class="emo">${x.e}</span>`
        : `<span class="h-bublina${x.cislo ? '' : ' pismo'}"><b class="pismo">${x.t}</b></span>`;
      const horni = el('div', 'h-ch-horni karta');
      const vzor = el('div', 'h-ch-vzor', kresli(r.cil));
      const misky = el('div', 'h-ch-misky');
      for (let i = 0; i < r.cel; i++) misky.appendChild(el('i'));
      horni.append(vzor, misky);
      const plocha = el('div', 'h-plocha');
      plocha.classList.add(r.nahoru ? 'h-nebe' : 'h-sad');

      function pridej() {
        const W = plocha.clientWidth, H = plocha.clientHeight;
        if (!W || !H) return;
        const jeCil = poCili >= 2 || Math.random() < 0.42;

        const o = el('div', 'h-obj');

            misky.children[chyceno - 1].innerHTML = kresli(r.cil);
            if (chyceno >= r.cel) { hotovo = true; plocha.classList.add('h-konec'); c.spravne(r.ok, horni); }
            else c.rekniKratce(Nc(chyceno));
            setTimeout(() => o.remove(), 400);
          } else {
            o.classList.add('h-mimo');
            c.spatne(vn, r.rada);
            setTimeout(() => o.remove(), 700);
          }
        });
        obj.push(p);
      }
      function tik(t) {
        if (!c.aktivni() || !R.isConnected || hotovo) return;
        if (cas0 == null) { cas0 = t; posl = t; }
        const dt = Math.min(0.05, (t - posl) / 1000); posl = t;
        if (t - cas0 > 700) {
          odPosl += dt;
          const vidim = obj.filter(p => !p.pryc).length;
          if ((odPosl > L.kad || !obj.length) && vidim < 7) { odPosl = 0; pridej(); }
        }
        const H = plocha.clientHeight;
        for (let i = obj.length - 1; i >= 0; i--) {
          const p = obj[i];
          if (p.pryc) { if (!p.o.isConnected) obj.splice(i, 1); continue; }
          p.y += (r.nahoru ? -1 : 1) * p.v * dt;
          p.faz += dt * 1.6;
          const sx = Math.sin(p.faz) * 10;
          p.o.style.transform = `translate(${p.x + sx}px, ${p.y}px)`;
          if ((r.nahoru && p.y < -p.h - 10) || (!r.nahoru && p.y > H + 10)) { p.o.remove(); obj.splice(i, 1); }
        }
        requestAnimationFrame(tik);
      }
      requestAnimationFrame(tik);
      r.stav = () => ({ chyceno, obj: obj.filter(p => !p.pryc).map(p => ({ cil: p.cil, o: p.o })) });
    },
  });
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* Davídkovo městečko – aktivity SVĚT a JAZYK (krmení, třídění, pořadí, hádanky, spojovačka, obtahování, začíná na…).
   API viz jadro.js. Všechny třídy CSS mají předponu s- (css/akt-svet.css). */
(function (G) {
  const { DB, U } = G;

  // n kusů bez opakování; c.vyberNove hlídá, aby se neopakovalo to, co bylo nedávno
  function vyberVic(c, pool, n, key) {

    { z: '🐔', zn: 'slepička', j: '🌽', jn: 'kukuřice', d: 'Kokodák, děkuju!' },

  U.akt('krmeni', {

    urovne: [{ t: 1, n: 2 }, { t: 2, n: 3 }, { t: 3, n: 4, navic: 1 }, { t: 5, n: 4, pary: true }],
    gen(c) {
      const n = c.L.n;

  const BARVY_VECI = {
