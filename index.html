      const h = mistni.length && Math.random() < 0.35 ? c.vyberNove(mistni, x => x.e) : c.vyberNove(HADANKY, x => x.e);
      const smi = x => x.e !== h.e && !(h.ne || []).includes(x.e) && !(x.ne || []).includes(h.e);
      const stejne = zamichej(HADANKY.filter(x => x.k === h.k && smi(x)));
      const jine = zamichej(HADANKY.filter(x => x.k !== h.k && smi(x)));
      // od 4 možností je jedna ze stejné skupiny (těžší), jinak jen z jiných skupin
      const ruse = c.L.n >= 4 ? [...stejne.slice(0, 1), ...jine.slice(0, c.L.n - 2)] : jine.slice(0, c.L.n - 1);
      return { h, moz: zamichej([h, ...ruse]), zadani: h.h, ok: jeTo(h), rada: 'Poslechni si hádanku ještě jednou a dobře přemýšlej.' };
    },
    render(c, r) {
      const otaz = el('div', 'karta s-hadanka', '<span class="s-otaznik">?</span>');
      c.stage.appendChild(otaz);
      volby(c, r.moz.map(x => ({ html: E(x.e, 'velke'), aria: x.o, spravne: x === r.h,
        poOk: () => { otaz.innerHTML = E(r.h.e, 's-odhaleno'); otaz.classList.add('s-vyreseno'); } })),
      { trida: 'volby s-hadanky-volby', ok: r.ok, rada: [r.rada, r.h.h] });
    },
  });

  /* ================= 5. SPOJOVAČKA ================= */
  function hvezda(n, R, r, cx = 50, cy = 52) {
    const b = [];
    for (let i = 0; i < n * 2; i++) { const rr = i % 2 ? r : R, a = -Math.PI / 2 + i * Math.PI / n; b.push([Math.round(cx + rr * Math.cos(a)), Math.round(cy + rr * Math.sin(a))]); }
    return b;
  }
  function pentagram() {
    const v = []; for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + i * 2 * Math.PI / 5; v.push([Math.round(50 + 44 * Math.cos(a)), Math.round(54 + 44 * Math.sin(a))]); }
    return [0, 2, 4, 1, 3].map(i => v[i]);
  }
  // body v rozsahu 0–100, kreslí se popořadě a nakonec se tvar uzavře
  const TVARY = [
    { n: 'domeček', e: '🏠', b: '#FF6B4A', p: [[20, 90], [20, 46], [50, 14], [80, 46], [80, 90]] },
    { n: 'hvězda', e: '⭐', b: '#FFC83D', p: pentagram() },
    { n: 'diamant', e: '💎', b: '#4CC9F0', p: [[30, 22], [70, 22], [92, 42], [50, 90], [8, 42]] },
    { n: 'stan', e: '⛺', b: '#2FB574', p: [[50, 10], [92, 86], [64, 86], [50, 58], [36, 86], [8, 86]] },
    { n: 'zmrzlina', e: '🍦', b: '#FF85A1', p: [[50, 94], [28, 48], [26, 30], [50, 8], [74, 30], [72, 48]] },
    { n: 'srdíčko', e: '❤️', b: '#E5322D', p: [[50, 88], [10, 48], [12, 22], [32, 10], [50, 26], [68, 10], [88, 22], [90, 48]] },
    { n: 'kočička', e: '🐱', b: '#FF8A1C', p: [[22, 88], [12, 46], [16, 8], [38, 28], [62, 28], [84, 8], [88, 46], [78, 88]] },
    { n: 'koruna', e: '👑', b: '#FFC83D', p: [[10, 82], [8, 24], [30, 50], [50, 14], [70, 50], [92, 24], [90, 82]] },
    { n: 'loďka', e: '⛵', b: '#3D9BF0', p: [[50, 6], [84, 58], [96, 62], [78, 88], [22, 88], [4, 62], [44, 62]] },
    { n: 'rybička', e: '🐟', b: '#3D9BF0', p: [[94, 50], [70, 24], [40, 26], [22, 42], [6, 24], [6, 76], [22, 58], [40, 74], [70, 76]] },
    { n: 'hvězda', e: '🌟', b: '#FFC83D', p: hvezda(5, 46, 20) },
    { n: 'raketa', e: '🚀', b: '#8E6CEF', p: [[50, 4], [66, 26], [66, 62], [84, 86], [62, 80], [50, 94], [38, 80], [16, 86], [34, 62], [34, 26]] },
    { n: 'stromeček', e: '🌲', b: '#2FB574', p: [[50, 4], [76, 36], [62, 36], [86, 68], [57, 68], [57, 94], [43, 94], [43, 68], [14, 68], [38, 36], [24, 36]] },
    { n: 'hrad', e: '🏰', b: '#8E6CEF', p: [[10, 92], [10, 22], [26, 22], [26, 38], [42, 38], [42, 22], [58, 22], [58, 38], [74, 38], [74, 22], [90, 22], [90, 92]] },
  ];

  U.akt('spojovacka', {
    nazev: 'Spojovačka', obor: 'svet', velka: true,
    urovne: [{ t: 1, min: 5, max: 6 }, { t: 3, min: 7, max: 9 }, { t: 5, min: 10, max: 12 }],
    gen(c) {
      const pool = TVARY.filter(t => t.p.length >= c.L.min && t.p.length <= c.L.max);
      const t = c.vyberNove(pool, x => x.e);
      return { t, zadani: 'Spoj tečky popořadě. Začni u jedničky!', ok: `Je to ${t.n}!`, rada: 'Hledej další číslo.' };
    },
    render(c, r) {
      const P = r.t.p, n = P.length;
      const M = 9, S = 100 + 2 * M;   // okraj kolem obrázku, aby se vešla čísla
      const pc = v => ((v + M) / S * 100) + '%';
      const cx = P.reduce((s, p) => s + p[0], 0) / n, cy = P.reduce((s, p) => s + p[1], 0) / n;
      const box = el('div', 'karta s-spoj');
      const ns = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(ns, 'svg');
      svg.setAttribute('viewBox', `${-M} ${-M} ${S} ${S}`); svg.setAttribute('class', 's-spoj-svg'); svg.setAttribute('aria-hidden', 'true');
      const vypln = document.createElementNS(ns, 'polygon');
      vypln.setAttribute('points', P.map(p => p.join(',')).join(' ')); vypln.setAttribute('class', 's-vypln'); vypln.style.fill = r.t.b;
      const cary = document.createElementNS(ns, 'g'); cary.setAttribute('class', 's-cary');
      svg.append(vypln, cary);
      box.appendChild(svg);
      const cara = (a, b) => {
        const l = document.createElementNS(ns, 'line');
        l.setAttribute('x1', a[0]); l.setAttribute('y1', a[1]); l.setAttribute('x2', b[0]); l.setAttribute('y2', b[1]);
        cary.appendChild(l);
      };
      let dalsi = 0;
      const tecky = P.map((p, i) => {
        const b = tl('s-tecka', '', 'tečka ' + (i + 1));
        b.style.left = pc(p[0]); b.style.top = pc(p[1]);
        let dx = p[0] - cx, dy = p[1] - cy; const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
        const cis = el('span', 's-cislo', String(i + 1));
        cis.style.setProperty('--dx', (dx * 34).toFixed(1) + 'px'); cis.style.setProperty('--dy', (dy * 34).toFixed(1) + 'px');
        b.append(el('i', 's-bod'), cis);
        b.onclick = () => {
          if (c.zamceno() || b.dataset.hotovo) return;
          if (i !== dalsi) { c.spatne(b, `Teď hledej číslo ${N(dalsi + 1)}.`); return; }
          b.dataset.hotovo = '1'; b.classList.add('s-hotova');
          if (i > 0) cara(P[i - 1], p);
          dalsi++;
          tecky.forEach(x => x.classList.remove('s-aktivni'));
          if (dalsi === n) {
            cara(p, P[0]);
            box.classList.add('s-nakresleno');
            box.appendChild(el('span', 'emo s-odmena', r.t.e));
            c.spravne(r.ok, box);
          } else {
            tecky[dalsi].classList.add('s-aktivni');
            nastavOk(c.stage, tecky[dalsi]);
            zvuk('tuk');
            c.rekniKratce(Nc(i + 1));
          }
        };
        box.appendChild(b); return b;
      });
      tecky[0].classList.add('s-aktivni');
      c.stage.appendChild(box);
      nastavOk(c.stage, tecky[0]);
    },
  });

  /* ================= 6. OBTAHOVÁNÍ ================= */
  const ROZ = 480;   // vnitřní rozlišení plátna
  function glyfMaska(znak, font, extra) {
    const cv = document.createElement('canvas'); cv.width = cv.height = ROZ;
    const g = cv.getContext('2d');
    g.font = font; g.textAlign = 'center'; g.textBaseline = 'alphabetic';
    const m = g.measureText(znak);
    const asc = m.actualBoundingBoxAscent || ROZ * 0.5, desc = m.actualBoundingBoxDescent || 0;
    const y = ROZ / 2 + (asc - desc) / 2;
    const lx = m.actualBoundingBoxLeft, rx = m.actualBoundingBoxRight;
    const x = (lx != null && rx != null) ? ROZ / 2 + (lx - rx) / 2 : ROZ / 2;
    g.fillStyle = '#000'; g.fillText(znak, x, y);
    if (extra) { g.lineWidth = extra; g.lineJoin = 'round'; g.strokeStyle = '#000'; g.strokeText(znak, x, y); }
    return { cv, x, y };
  }

  U.akt('obtahovani', {
    nazev: 'Obtahování', obor: 'jazyk', velka: true,
    urovne: [{ t: 1, druh: 'cisla' }, { t: 2, druh: 'pismena' }, { t: 5, druh: 'pismena', male: 0.5 }],
    gen(c) {
      if (c.L.druh === 'cisla') {
        const n = c.vyberNove([1, 2, 3, 4, 5, 6, 7, 8, 9], x => 'o' + x);
        return { znak: String(n), zadani: `Tohle je číslo ${N(n)}. Obtáhni ho prstem.`, ok: `Krásně jsi obtáhl číslo ${N(n)}.`,
          rada: 'Jezdi prstem po šedém čísle.' };
      }
      const P = c.vyberNove(znamaPismena(c), x => 'o' + x.p);
      const male = Math.random() < (c.L.male || 0);
      return { znak: male ? P.m : P.p, P, zadani: `Tohle je ${male ? 'malé ' : ''}písmenko ${P.jm}. Obtáhni ho prstem.`,
        ok: `Krásně jsi obtáhl ${male ? 'malé ' : ''}písmenko ${P.jm}.`, rada: 'Jezdi prstem po šedém písmenku.' };
    },
    async render(c, r) {
      const male = /[a-zěščřžýáíéůú]/.test(r.znak);
      const vel = male ? 330 : 360, font = `700 ${vel}px Andika`;
      try { await Promise.race([document.fonts.load(font, r.znak), c.cekej(1500)]); } catch (e) {}
      if (!c.aktivni()) return;
      const obal = el('div', 's-obtah');
      const ram = el('div', 'karta s-platno');
      const cv = document.createElement('canvas'); cv.width = cv.height = ROZ; cv.className = 's-canvas';
      cv.setAttribute('aria-label', 'Obtáhni ' + r.znak);
      ram.appendChild(cv);
      const panel = el('div', 's-obtah-panel');
      const guma = tl('karta s-guma', `${E('🧽')}<span class="s-guma-tx">Smazat</span>`, 'Smazat');
      panel.appendChild(guma);
      obal.append(ram, panel);
      c.stage.appendChild(obal);

      const g = cv.getContext('2d');
      const pod = glyfMaska(r.znak, font, 0);
      // maska tolerance (písmenko + okraj), kam se smí čmárat
      const tol = glyfMaska(r.znak, font, 64).cv.getContext('2d').getImageData(0, 0, ROZ, ROZ).data;
      const mas = pod.cv.getContext('2d').getImageData(0, 0, ROZ, ROZ).data;
      // písmenko rozdělíme na 3 pásy (shora dolů), každý musí být aspoň trochu obtažený – ne jen půlka písmenka
      let glyfPx = 0, y0 = ROZ, y1 = 0;
      for (let i = 3; i < mas.length; i += 4) if (mas[i] > 100) { glyfPx++; const y = ((i - 3) / 4 / ROZ) | 0; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      const pas = i => Math.min(2, Math.max(0, Math.floor((((i - 3) / 4 / ROZ) - y0) / ((y1 - y0 + 1) / 3))));
      const pasPx = [0, 0, 0];
      for (let i = 3; i < mas.length; i += 4) if (mas[i] > 100) pasPx[pas(i)]++;

      const ink = document.createElement('canvas'); ink.width = ink.height = ROZ;
      const ig = ink.getContext('2d');
      ig.lineCap = ig.lineJoin = 'round'; ig.lineWidth = 46; ig.strokeStyle = '#FF6B4A'; ig.fillStyle = '#FF6B4A';

      function kresli() {
        g.clearRect(0, 0, ROZ, ROZ);
        // podklad: světlé písmenko s čárkovaným obrysem
        g.font = font; g.textAlign = 'center'; g.textBaseline = 'alphabetic';
        g.fillStyle = '#E3ECF8'; g.fillText(r.znak, pod.x, pod.y);
        g.save(); g.setLineDash([10, 10]); g.lineWidth = 4; g.strokeStyle = '#9DB2D3'; g.strokeText(r.znak, pod.x, pod.y); g.restore();
        g.drawImage(ink, 0, 0);
      }
      kresli();

      const tahy = new Map();
      const bod = e => { const b = cv.getBoundingClientRect(); return [(e.clientX - b.left) / b.width * ROZ, (e.clientY - b.top) / b.height * ROZ]; };
      cv.addEventListener('pointerdown', e => {
        if (c.zamceno()) return;
        e.preventDefault();
        try { cv.setPointerCapture(e.pointerId); } catch (x) {}
        const p = bod(e); tahy.set(e.pointerId, p);
        ig.beginPath(); ig.arc(p[0], p[1], ig.lineWidth / 2, 0, Math.PI * 2); ig.fill();
        kresli();
      });
      cv.addEventListener('pointermove', e => {
        const q = tahy.get(e.pointerId); if (!q || c.zamceno()) return;
        const p = bod(e);
        ig.beginPath(); ig.moveTo(q[0], q[1]); ig.lineTo(p[0], p[1]); ig.stroke();
        tahy.set(e.pointerId, p); kresli();
      });
      let varovano = false;
      const konec = e => {
        if (!tahy.has(e.pointerId)) return;
        tahy.delete(e.pointerId);
        if (tahy.size || c.zamceno()) return;
        const d = ig.getImageData(0, 0, ROZ, ROZ).data;
        let kryto = 0, inkPx = 0, venku = 0; const pasK = [0, 0, 0];
        for (let i = 3; i < d.length; i += 4) {
          if (d[i] < 100) continue;
          inkPx++;
          if (mas[i] > 100) { kryto++; pasK[pas(i)]++; }
          if (tol[i] < 100) venku++;
        }
        const pokryti = kryto / (glyfPx || 1), mimo = venku / (inkPx || 1);
        const pasy = pasK.every((k, j) => !pasPx[j] || k / pasPx[j] >= 0.4);
        cv.dataset.pokryti = pokryti.toFixed(2); cv.dataset.mimo = mimo.toFixed(2); cv.dataset.pasy = pasK.map((k, j) => (k / (pasPx[j] || 1)).toFixed(2)).join(',');
        if (pokryti >= 0.6 && pasy && mimo <= 0.3) {
          ram.classList.add('s-povedlo');
          ig.globalCompositeOperation = 'source-in'; ig.fillStyle = '#2FB574'; ig.fillRect(0, 0, ROZ, ROZ); ig.globalCompositeOperation = 'source-over';
          kresli();
          c.spravne(r.ok, ram);
        } else if (mimo > 0.3 && (pokryti >= 0.6 || inkPx > glyfPx * 0.8)) {
          // počmáráno i mimo písmenko – smažeme a zkusí znovu
          c.spatne(ram, r.rada, varovano ? null : 'Jezdi jen po písmenku. Smažu to a zkusíš to znovu.');
          varovano = true;
          setTimeout(() => { if (c.aktivni()) { ig.clearRect(0, 0, ROZ, ROZ); kresli(); } }, 700);
        }
      };
      cv.addEventListener('pointerup', konec);
      cv.addEventListener('pointercancel', konec);
      guma.onclick = () => { if (c.zamceno()) return; zvuk('pop'); ig.clearRect(0, 0, ROZ, ROZ); kresli(); };
    },
  });

  /* ================= 7. ZAČÍNÁ NA… ================= */
  // obrázky, které dítě může pojmenovat i jinak (zajíček/králík, míč/balón, hrad/zámek, taxík/auto, čepice/kšiltovka), vynecháme
  const NEJISTE = ['zajíček', 'míč', 'hrad', 'taxík', 'čepice', 'med', 'loďka'];
  const SOUROZ = { S: 'Š', Š: 'S', Z: 'Ž', Ž: 'Z', C: 'Č', Č: 'C', R: 'Ř', Ř: 'R' };
  const pismenoSlova = n => (/^ch/i.test(n) ? null : DB.PISMENA.find(P => P.m === n.charAt(0).toLowerCase()) || null);
  const SLOVA_ZN = DB.PRVNI.filter(n => !NEJISTE.includes(n)).map(V).filter(v => v && pismenoSlova(v.n));

  U.akt('zacina_na', {
    nazev: 'Začíná na…', obor: 'jazyk',
    urovne: [{ t: 3, n: 3 }, { t: 4, n: 4 }],
    gen(c) {
      const zn = znamaPismena(c).filter(P => SLOVA_ZN.some(v => pismenoSlova(v.n) === P));
      const pool = zn.length ? zn : DB.PISMENA.filter(P => SLOVA_ZN.some(v => pismenoSlova(v.n) === P));
      const P = c.vyberNove(pool, x => 'z' + x.p);
      const v = c.vyberNove(SLOVA_ZN.filter(x => pismenoSlova(x.n) === P), x => 'zs' + x.n);
      const ruse = [];
      const jine = zamichej(SLOVA_ZN.filter(x => { const Q = pismenoSlova(x.n); return Q !== P && SOUROZ[P.p] !== Q.p && x.e !== v.e; }));
      for (const x of jine) {
        if (ruse.length >= c.L.n - 1) break;
        if (ruse.some(y => pismenoSlova(y.n) === pismenoSlova(x.n) || y.e === x.e)) continue;
        ruse.push(x);
      }
      return { P, v, moz: zamichej([v, ...ruse]), zadani: `Najdi obrázek, který začíná na ${P.jm}.`,
        ok: `${cap(v.n)} začíná na ${P.jm}!`, rada: 'Řekni si každý obrázek pomalu nahlas. Co slyšíš úplně na začátku?' };
    },
    render(c, r) {
      const k = el('div', 'karta s-pismeno', `<span class="pismo s-velke">${r.P.p}</span><span class="pismo s-male">${r.P.m}</span>`);
      k.setAttribute('role', 'img'); k.setAttribute('aria-label', 'písmenko ' + r.P.jm);
      c.stage.appendChild(k);
      volby(c, r.moz.map(x => ({ html: E(x.e, 'velke'), aria: x.n, spravne: x === r.v })), { trida: 'volby s-zacina', ok: r.ok, rada: r.rada });
      // špatná volba řekne, na co ten obrázek začíná
      [...c.stage.querySelectorAll('.s-zacina .volba')].forEach((b, i) => {
        const x = r.moz[i]; if (x === r.v) return;
        b.onclick = () => { if (c.zamceno()) return; c.spatne(b, r.rada, `${cap(x.n)} začíná na ${pismenoSlova(x.n).jm}.`); };
      });
    },
  });
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Krajina: kreslené pozadí podle toho, kde Davídek právě je
   (vesnička, lesík, jezírko, město, náměstí, hrad). Vše jako SVG, bez obrázků. */
(function (G) {
  const INK = '#26244A';
  const n = x => x.toFixed(1);

  const KRAJ = {
    vesnicka: { zem: '#C4E6A6', silnice: '#EBD5A6', dekor: ['🌻', '🐓', '🌳', '🏡', '🌾', '🐑', '🚜', '🌼'] },
    lesik: { zem: '#A4D290', silnice: '#D9B98A', dekor: ['🌲', '🌳', '🌲', '🍄', '🦔', '🌲', '🦌', '🌰'] },
    jezirko: { zem: '#BFE6AF', silnice: '#E3CFA4', dekor: ['🦆', '🪷', '🌾', '🐸', '🌿', '🐟', '🌳'] },
    mesto: { zem: '#E1E4EC', silnice: '#A7ADBB', dekor: ['🚦', '🚌', '🌳', '🚕', '🛴', '🏢', '🚲'] },
    namesti: { zem: '#EBDDBF', silnice: '#D9C49B', dekor: ['🕊️', '🌷', '🎪', '🌳', '🏛️', '🎈', '⛲'] },
    hrad: { zem: '#D8CDE6', silnice: '#C2B8CC', dekor: ['🌲', '🚩', '🛡️', '🌲', '🐉', '🏰', '⚔️'] },
    den: { zem: '#F6E2C6', silnice: '#EBD5A6', dekor: ['🌳', '🌷', '🏡', '🎈', '🌻', '🦋'] },
  };

  /* ---------- pásy na mapě ---------- */
  function pole(x, y, w, h, rot) {
    let s = `<g transform="rotate(${rot} ${n(x + w / 2)} ${n(y + h / 2)})"><rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" rx="14" fill="#E9D58B" stroke="#C9AE5C" stroke-width="3"/>`;
    for (let i = 1; i < 6; i++) s += `<line x1="${n(x + 8)}" y1="${n(y + h * i / 6)}" x2="${n(x + w - 8)}" y2="${n(y + h * i / 6)}" stroke="#C9AE5C" stroke-width="3" stroke-linecap="round"/>`;
    return s + '</g>';
  }
  function plot(x, y, w) {
    let s = `<line x1="${n(x)}" y1="${n(y)}" x2="${n(x + w)}" y2="${n(y)}" stroke="#A0703C" stroke-width="5"/><line x1="${n(x)}" y1="${n(y + 14)}" x2="${n(x + w)}" y2="${n(y + 14)}" stroke="#A0703C" stroke-width="5"/>`;
    for (let i = 0; i <= w; i += 22) s += `<rect x="${n(x + i - 3)}" y="${n(y - 10)}" width="7" height="34" rx="2" fill="#B9844A" stroke="#7A5428" stroke-width="2"/>`;
    return s;
  }
  function rybnik(cx, cy, rx, ry) {
    let s = `<ellipse cx="${n(cx)}" cy="${n(cy)}" rx="${n(rx)}" ry="${n(ry)}" fill="#8FD3F4" stroke="#5DADE2" stroke-width="7"/>`;
    for (let i = -1; i <= 1; i++) s += `<path d="M${n(cx - rx * 0.45)} ${n(cy + i * ry * 0.35)} q${n(rx * 0.12)} -8 ${n(rx * 0.24)} 0 t${n(rx * 0.24)} 0" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".7"/>`;
    s += `<circle cx="${n(cx + rx * 0.45)}" cy="${n(cy - ry * 0.3)}" r="14" fill="#5DBB63" stroke="#3E8E45" stroke-width="2"/><circle cx="${n(cx - rx * 0.55)}" cy="${n(cy + ry * 0.35)}" r="11" fill="#5DBB63" stroke="#3E8E45" stroke-width="2"/>`;
    return s;
  }
  function budova(x, y, w, h, barva) {
    let s = `<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" rx="6" fill="${barva}" stroke="${INK}" stroke-width="3" opacity=".9"/>`;
    for (let r = 0; r < Math.floor((h - 16) / 30); r++) for (let k = 0; k < Math.floor((w - 10) / 26); k++)
      s += `<rect x="${n(x + 10 + k * 26)}" y="${n(y + 12 + r * 30)}" width="14" height="16" rx="2" fill="#FFF6D6" stroke="${INK}" stroke-width="1.5"/>`;
    return s;
  }
  function zed(x, y, w) {
    let s = `<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="40" fill="#B9B2C4" stroke="#6E6680" stroke-width="3"/>`;
    for (let i = 0; i < w - 10; i += 24) s += `<rect x="${n(x + i)}" y="${n(y - 14)}" width="14" height="16" fill="#B9B2C4" stroke="#6E6680" stroke-width="3"/>`;
    return s;
  }
  function kaluzKostek(x, y, w, h, rnd) {
    let s = '';
    for (let yy = y; yy < y + h; yy += 26) for (let xx = x + ((yy / 26) % 2 ? 13 : 0); xx < x + w; xx += 30)
      if (rnd() < 0.55) s += `<rect x="${n(xx)}" y="${n(yy)}" width="24" height="18" rx="6" fill="#DECBA4" opacity=".75"/>`;
    return s;
  }

  // vykreslí podklad pro jednu kapitolu na mapě (pás od top, výška h, šířka W)
  function pas(id, top, h, W, rnd) {
    const K = KRAJ[id] || KRAJ.den;
    let s = `<rect x="0" y="${n(top)}" width="${n(W)}" height="${n(h)}" fill="${K.zem}"/>`;
    const strana = i => (i % 2 ? W * 0.9 : W * 0.1);
    for (let y = top + 140, i = 0; y < top + h - 120; y += 260, i++) {
      const x = strana(i + (rnd() < 0.5 ? 0 : 1)) + (rnd() - 0.5) * 30;
      if (id === 'vesnicka') {
        s += `<ellipse cx="${n(x)}" cy="${n(y + 40)}" rx="${n(W * 0.16)}" ry="70" fill="#B0DB90"/>`;
        if (i % 2 === 0) s += pole(x - 70, y - 40, 140, 90, rnd() * 20 - 10); else s += plot(x - 80, y + 70, 160);
      } else if (id === 'lesik') {
        for (let k = 0; k < 4; k++) s += `<circle cx="${n(x + (rnd() - 0.5) * 120)}" cy="${n(y + (rnd() - 0.5) * 140)}" r="${n(30 + rnd() * 26)}" fill="${rnd() < 0.5 ? '#6FAE63' : '#5A9852'}" opacity=".75"/>`;
      } else if (id === 'jezirko') {
        if (i % 2 === 0) s += rybnik(x, y + 20, Math.max(80, W * 0.14), 70);
        else s += `<path d="M${n(x - 40)} ${n(y + 60)} q10 -50 4 -80 M${n(x - 20)} ${n(y + 60)} q6 -60 14 -96 M${n(x)} ${n(y + 60)} q-4 -44 -10 -70" stroke="#5E8C3A" stroke-width="5" fill="none" stroke-linecap="round"/>`;
      } else if (id === 'mesto') {
        const bw = Math.max(70, W * 0.11);
        s += budova(x - bw / 2, y - 90, bw, 150 + rnd() * 40, ['#F7B267', '#9AD1D4', '#F4845F', '#C3B1E1', '#90BE6D'][i % 5]);
      } else if (id === 'namesti') {
        s += kaluzKostek(x - 90, y - 70, 180, 160, rnd);
        if (i % 3 === 1) s += `<circle cx="${n(x)}" cy="${n(y)}" r="46" fill="#B7E0F5" stroke="#8A7B60" stroke-width="10"/><circle cx="${n(x)}" cy="${n(y)}" r="12" fill="#FFFFFF" opacity=".8"/>`;
        else s += `<circle cx="${n(x)}" cy="${n(y + 50)}" r="34" fill="#8BC37E" stroke="#6E9E62" stroke-width="5"/>`;
      } else if (id === 'hrad') {
        const zw = Math.max(110, W * 0.15);
        s += i % 2 === 0 ? zed(x - zw / 2, y, zw) : `<ellipse cx="${n(x)}" cy="${n(y + 50)}" rx="${n(W * 0.15)}" ry="60" fill="#C6B6D8"/>`;
      } else {
        s += `<ellipse cx="${n(x)}" cy="${n(y + 40)}" rx="${n(W * 0.14)}" ry="60" fill="#F0D3AE"/>`;
      }
    }
    return s;
  }

  /* ---------- pozadí obrazovky s úkolem ---------- */
  const cachePozadi = {};
  function pozadi(id) {
    if (cachePozadi[id]) return cachePozadi[id];
    const K = KRAJ[id] || KRAJ.den, H = 1000, W = 1600, hor = 760;
    let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMax slice">` +
      `<defs><linearGradient id="n" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CFE9FF"/><stop offset="1" stop-color="#F3F9FF"/></linearGradient></defs>` +
      `<rect width="${W}" height="${H}" fill="url(#n)"/>` +
      `<circle cx="1380" cy="150" r="70" fill="#FFE27A"/>` +
      `<g fill="#FFFFFF" opacity=".9"><ellipse cx="260" cy="170" rx="90" ry="34"/><ellipse cx="330" cy="150" rx="70" ry="40"/><ellipse cx="900" cy="110" rx="80" ry="28"/><ellipse cx="960" cy="95" rx="55" ry="32"/></g>`;
    if (id === 'vesnicka') {
      s += `<ellipse cx="300" cy="${hor + 40}" rx="520" ry="150" fill="#A8D88A"/><ellipse cx="1300" cy="${hor + 50}" rx="560" ry="170" fill="#B6DE98"/>`;
      s += `<rect x="1080" y="${hor - 150}" width="200" height="150" fill="#D9534F" stroke="${INK}" stroke-width="5"/><polygon points="1060,${hor - 150} 1180,${hor - 250} 1300,${hor - 150}" fill="#A33A37" stroke="${INK}" stroke-width="5"/><rect x="1150" y="${hor - 90}" width="60" height="90" fill="#FFF3D6" stroke="${INK}" stroke-width="4"/>`;
      s += plot(120, hor - 10, 520);
    } else if (id === 'lesik') {
      for (let i = 0; i < 16; i++) { const x = i * 105 + (i % 2) * 30, hh = 220 + (i % 3) * 60; s += `<polygon points="${x},${hor + 20} ${x + 60},${hor - hh} ${x + 120},${hor + 20}" fill="${i % 2 ? '#4F8A4A' : '#6BAA5F'}" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>`; }
    } else if (id === 'jezirko') {
      s += `<ellipse cx="800" cy="${hor + 130}" rx="700" ry="170" fill="#8FD3F4" stroke="#5DADE2" stroke-width="8"/>`;
      for (let i = 0; i < 6; i++) s += `<path d="M${200 + i * 220} ${hor + 110} q40 -16 80 0 t80 0" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity=".8"/>`;
      s += `<circle cx="420" cy="${hor + 170}" r="34" fill="#5DBB63" stroke="#3E8E45" stroke-width="4"/><circle cx="1180" cy="${hor + 150}" r="28" fill="#5DBB63" stroke="#3E8E45" stroke-width="4"/>`;
      for (let i = 0; i < 7; i++) s += `<path d="M${40 + i * 18} ${hor + 80} q${i % 2 ? 8 : -8} -90 ${i % 2 ? 2 : -4} -160" stroke="#5E8C3A" stroke-width="7" fill="none" stroke-linecap="round"/>`;
    } else if (id === 'mesto') {
      const b = ['#F7B267', '#9AD1D4', '#F4845F', '#C3B1E1', '#90BE6D', '#FFD166'];
      for (let i = 0; i < 9; i++) { const w = 150 + (i % 3) * 30, h = 260 + ((i * 47) % 200); s += budova(i * 180 - 20, hor - h, w, h, b[i % b.length]); }
    } else if (id === 'namesti') {
      s += `<rect x="560" y="${hor - 330}" width="480" height="330" fill="#F2E3C6" stroke="${INK}" stroke-width="5"/><polygon points="540,${hor - 330} 800,${hor - 470} 1060,${hor - 330}" fill="#C8553D" stroke="${INK}" stroke-width="5"/><rect x="770" y="${hor - 580}" width="60" height="120" fill="#F2E3C6" stroke="${INK}" stroke-width="5"/><circle cx="800" cy="${hor - 520}" r="22" fill="#FFFFFF" stroke="${INK}" stroke-width="4"/>`;
      for (let i = 0; i < 5; i++) s += `<rect x="${600 + i * 90}" y="${hor - 250}" width="40" height="70" rx="20" fill="#9AD1D4" stroke="${INK}" stroke-width="4"/>`;
      s += budova(80, hor - 280, 220, 280, '#F7B267') + budova(1300, hor - 300, 230, 300, '#C3B1E1');
    } else if (id === 'hrad') {
      s += `<ellipse cx="800" cy="${hor + 60}" rx="900" ry="220" fill="#C6B6D8"/>`;
      s += `<rect x="560" y="${hor - 300}" width="480" height="260" fill="#B9B2C4" stroke="${INK}" stroke-width="5"/><rect x="500" y="${hor - 420}" width="120" height="380" fill="#B9B2C4" stroke="${INK}" stroke-width="5"/><rect x="980" y="${hor - 420}" width="120" height="380" fill="#B9B2C4" stroke="${INK}" stroke-width="5"/>`;
      s += `<polygon points="490,${hor - 420} 560,${hor - 520} 630,${hor - 420}" fill="#7B5EA7" stroke="${INK}" stroke-width="5"/><polygon points="970,${hor - 420} 1040,${hor - 520} 1110,${hor - 420}" fill="#7B5EA7" stroke="${INK}" stroke-width="5"/>`;
      s += `<path d="M760 ${hor - 40} v-80 a40 40 0 0 1 80 0 v80z" fill="#6E4F3A" stroke="${INK}" stroke-width="5"/><path d="M560 ${hor - 520} v-60 l40 14 -40 14" fill="#E63946" stroke="${INK}" stroke-width="4"/>`;
    }
    s += `<rect x="0" y="${hor + (id === 'jezirko' ? 200 : 0)}" width="${W}" height="${H}" fill="${K.zem}"/>`;
    if (id === 'namesti') for (let y = hor + 20; y < H; y += 34) for (let x = (y / 34 % 2) * 20; x < W; x += 44) s += `<rect x="${x}" y="${y}" width="34" height="24" rx="8" fill="#DECBA4"/>`;
    s += '</svg>';
    cachePozadi[id] = `url("data:image/svg+xml;utf8,${encodeURIComponent(s)}")`;
    return cachePozadi[id];
  }

  G.Krajina = { KRAJ, pas, pozadi };
})(window);

</script>
<script>
/* Davídkovo městečko – mapa, příběh, mise složené z různých aktivit, nálepky, panel pro rodiče. */
(function () {
  const { DB, U, Hlas, Zvuk, Krajina } = window;
  const P = U.pomoc;
  const $ = s => document.querySelector(s);
  const el = U.h.el;
  const cekej = ms => new Promise(r => setTimeout(r, ms));
  const KRIZ = 8;                                   // křižovatek v kapitole
  const KOL = [0, 6, 6, 7, 7, 8, 8];               // kol v jedné misi podle kapitoly
  const PLAY = '<svg class="play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z" fill="#fff" stroke="#26244A" stroke-width="1.6" stroke-linejoin="round"/></svg>';

  /* ---------- uložený postup (jen v tomto prohlížeči) ---------- */
  const KLIC = 'mestecko-v2';
  const novyStav = () => ({ v: 2, cesta: [], typy: {}, recent: {}, hist: [], histMist: [], pismena: 0, dnesNove: false,
    nalepky: [], omal: {}, hlas: true, limit: 0, den: '', dnes: 0, celkem: 0 });
  let S = novyStav();
  try { const s = JSON.parse(localStorage.getItem(KLIC)); if (s && s.v === 2) S = Object.assign(novyStav(), s); } catch (e) {}
  function uloz() { try { localStorage.setItem(KLIC, JSON.stringify(S)); } catch (e) {} }
  const dnesni = () => new Date().toISOString().slice(0, 10);
  function hlidejDen() { if (S.den !== dnesni()) { S.den = dnesni(); S.dnes = 0; uloz(); } }

  const kapDef = i => (i < DB.KAPITOLY.length ? DB.KAPITOLY[i] : DB.DEN);
  const aktualni = () => S.cesta[S.cesta.length - 1];
  const hotovych = kap => kap.kriz.filter(k => k.hotovo).length;

  /* ---------- obtížnost ---------- */
  const typStav = a => S.typy[a] || (S.typy[a] = { m: 0, hry: 0, kola: 0, chyby: 0, prvni: 0 });
  function strop(a, tier) { let i = 0; U.akty[a].urovne.forEach((L, k) => { if (L.t <= tier) i = k; }); return i; }
  const dostupna = (a, tier, ki) => !!U.akty[a] && U.akty[a].urovne[0].t <= tier && !(a === 'omalovanka' && S.omal[ki]);
  const aktivityMista = (M, tier, ki) => M.akt.filter(a => dostupna(a, tier, ki));
  function staroba(a) { const i = S.hist.lastIndexOf(a); return i < 0 ? 30 : S.hist.length - 1 - i; }

  /* ---------- křižovatka: 2 až 4 cesty ---------- */
  function novaKrizovatka(kap) {
    const K = kapDef(kap.i);
    const kolik = K.tier <= 1 ? P.rnd(2, 3) : P.vyber([2, 3, 3, 3, 4, 4]);
    const nedavno = S.histMist.slice(-4);
    const kand = K.mista.filter(m => aktivityMista(DB.MISTA[m], K.tier, kap.i).length >= 3)
      .map(m => ({ m, s: (nedavno.includes(m) ? 5 - nedavno.length + nedavno.lastIndexOf(m) : 0) + Math.random() * 3 }))
      .sort((a, b) => a.s - b.s);
    return { mista: P.zamichej(kand.slice(0, Math.min(kolik, kand.length)).map(x => ({ m: x.m }))), volba: null, hotovo: false };
  }
  function aktualniKrizovatka() {
    const kap = aktualni();
    let kr = kap.kriz.find(k => !k.hotovo);
    if (!kr && kap.kriz.length < KRIZ) { kr = novaKrizovatka(kap); kap.kriz.push(kr); uloz(); }
    return kr || null;
  }

  /* ---------- mise: pestrý sled aktivit ---------- */
  function sestavMisi(M, tier, ki) {
    const pool = aktivityMista(M, tier, ki);
    const R = KOL[Math.min(tier, 6)], plan = [], pocet = {};
    let velkych = 0;
    for (let r = 0; r < R; r++) {
      const prev = plan[plan.length - 1];
      const kand = pool.filter(a => a !== prev && (pocet[a] || 0) < 2 && !(U.akty[a].velka && (velkych >= 2 || (prev && U.akty[prev].velka))));
      const z = kand.length ? kand : pool.filter(a => a !== prev);
      const a = z.map(a => ({ a, s: (pocet[a] || 0) * 4 - Math.min(staroba(a), 12) * 0.6 + Math.random() * 3 + (a === 'omalovanka' ? 3 : 0) }))
        .sort((x, y) => x.s - y.s)[0].a;
      plan.push(a); pocet[a] = (pocet[a] || 0) + 1; if (U.akty[a].velka) velkych++;
    }
    // omalovánka je odměna na konec
    const io = plan.indexOf('omalovanka');
    if (io >= 0 && io !== plan.length - 1) { plan.splice(io, 1); plan.push('omalovanka'); }
    return plan;
  }
  function vyberNove(a) {
    return (pool, key) => {
      const r = S.recent[a] || (S.recent[a] = []);
      const w = Math.min(14, Math.floor(pool.length * 0.6));
      const okno = r.slice(-w);
      const volne = pool.filter(x => !okno.includes(key(x)));
      const z = volne.length ? volne : pool;
      const x = z[Math.floor(Math.random() * z.length)];
      r.push(key(x)); if (r.length > 40) r.splice(0, r.length - 40);
      return x;
    };
  }

  /* ---------- obrazovky ---------- */
  const OBR = ['start', 'mapa', 'ukol', 'pribeh', 'album'];
  function ukaz(k) { OBR.forEach(o => { $('#obr-' + o).hidden = o !== k; }); }
  function krajina(id) {
    const bg = Krajina.pozadi(id);
    ['#obr-ukol', '#obr-pribeh'].forEach(s => { $(s).style.backgroundImage = bg; });
  }
  function konfety(x, y, n = 28) {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const barvy = ['#FF6B4A', '#FFC83D', '#2FB574', '#3D9BF0', '#8E6CEF', '#FF7EB6'];
    for (let i = 0; i < n; i++) {
      const k = el('i', 'konfeta'), a = Math.random() * Math.PI * 2, r = 80 + Math.random() * 170;
      k.style.left = x + 'px'; k.style.top = y + 'px'; k.style.background = P.vyber(barvy);
      k.style.setProperty('--dx', Math.cos(a) * r + 'px'); k.style.setProperty('--dy', Math.sin(a) * r - 70 + 'px'); k.style.setProperty('--rot', P.rnd(-540, 540) + 'deg');
      document.body.appendChild(k); setTimeout(() => k.remove(), 1200);
    }
  }
  const textPolozek = x => [x].flat().filter(Boolean).map(p => (typeof p === 'string' ? p : p.t)).join(' ');

  /* ---------- scéna příběhu ---------- */
  function scena({ postava = '🐕', jmeno = 'Ťapka', obsah = '', vety = [] }) {
    return new Promise(res => {
      ukaz('pribeh');
      const o = $('#pribeh-obsah'); o.innerHTML = '';
      const b = el('button', 'kulate obri-tl dal', PLAY); b.type = 'button'; b.setAttribute('aria-label', 'Dál');
      b.onclick = () => { Hlas.stop(); Zvuk.pop(); res(); };
      const opak = el('button', 'kulate', '<span class="emo">🔊</span>'); opak.type = 'button'; opak.setAttribute('aria-label', 'Zopakovat');
      opak.onclick = () => Hlas.rekni(vety);
      const tl = el('div', 'pribeh-tlacitka'); tl.append(opak, b);
      o.append(el('div', 'pribeh-hlava', `<span class="pribeh-postava emo">${postava}</span><span class="pribeh-jmeno">${jmeno}</span>`),
        el('div', 'bublina velka', textPolozek(vety)), el('div', 'pribeh-telo', obsah), tl);
      Hlas.rekni(vety);
    });
  }
  function slotyKapitoly(kap) {
    const K = kapDef(kap.i), n = hotovych(kap);
    return `<div class="sloty-kap">${K.predmety.map((p, i) => `<span class="slot-kap ${i < n ? 'plny' : ''}">${i < n ? `<span class="emo">${p}</span>` : ''}</span>`).join('')}<span class="cil-kap emo">${K.cil}</span></div>`;
  }
  async function uvodKapitoly() {
    const kap = aktualni(), K = kapDef(kap.i);
    krajina(K.id);
    await scena({ vety: [K.uvod], obsah: `<h2 class="pribeh-nadpis">${K.nazev}</h2>${slotyKapitoly(kap)}` });
    kap.uvod = true; uloz();
  }

  /* ---------- MAPA ---------- */
  function seed(n) { return () => { n |= 0; n = n + 0x6D2B79F5 | 0; let t = Math.imul(n ^ n >>> 15, 1 | n); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const cesta = (a, b) => { const m = (a.y + b.y) / 2; return `M${a.x.toFixed(1)} ${a.y.toFixed(1)} C${a.x.toFixed(1)} ${m.toFixed(1)} ${b.x.toFixed(1)} ${m.toFixed(1)} ${b.x.toFixed(1)} ${b.y.toFixed(1)}`; };
  const pozice = (n, W) => ({ 1: [0.5], 2: [0.27, 0.73], 3: [0.17, 0.5, 0.83], 4: [0.13, 0.38, 0.62, 0.87] }[n]).map(f => f * W);

  function renderMapa() {
    hlidejDen();
    const mapa = $('#mapa'), svet = $('#svet');
    const W = Math.max(320, mapa.clientWidth);
    const rowH = Math.max(230, Math.min(290, W * 0.38)), hdr = 120;
    let y = 30;
    const pasy = [], cesty = [], uzly = [];
    let prev = { x: W / 2, y }, avatar = null, aktivniKr = null;
    aktualniKrizovatka();
    const pauza = S.limit > 0 && S.dnes >= S.limit;
    uzly.push(`<div class="uzel start" style="left:${W / 2}px;top:${y}px"><span class="emo">🏡</span></div>`);

    S.cesta.forEach((kap, ki) => {
      const K = kapDef(kap.i), top = y, kraj = Krajina.KRAJ[K.id] || Krajina.KRAJ.den;
      const rnd = seed(ki * 977 + 13);
      uzly.push(`<div class="kap-stitek" style="top:${y + 34}px"><span>${K.nazev}</span></div>`);
      y += hdr;
      let budouci = false;
      for (let r = 0; r < KRIZ; r++) {
        const kr = kap.kriz[r], fy = y + 26, hy = y + rowH * 0.6, fork = { x: W / 2, y: fy };
        for (let d = 0; d < 3; d++) {
          const dx = d === 1 ? (rnd() < 0.5 ? W * 0.03 : W * 0.97) : rnd() < 0.5 ? W * (0.02 + rnd() * 0.07) : W * (0.91 + rnd() * 0.07);
          uzly.push(`<span class="dekor emo" style="left:${dx}px;top:${y + rowH * (0.1 + rnd() * 0.8)}px">${kraj.dekor[Math.floor(rnd() * kraj.dekor.length)]}</span>`);
        }
        if (kr && !budouci) {
          cesty.push({ d: cesta(prev, fork), c: 'hlavni', k: kraj });
          const xs = pozice(kr.mista.length, W), dum = Math.round(Math.min(140, W / (kr.mista.length + 1.1)));
          kr.mista.forEach((m, j) => {
            const M = DB.MISTA[m.m], h = { x: xs[j], y: hy };
            const vybrany = kr.hotovo && kr.volba === j, slepy = kr.hotovo && kr.volba !== j;
            cesty.push({ d: cesta(fork, h), c: slepy ? 'slepa' : 'hlavni', k: kraj });
            const stav = vybrany ? 'hotovy' : slepy ? 'slepy' : (pauza ? 'zamceny' : 'aktivni');
            const odz = vybrany ? `<span class="odznak emo">${K.predmety[kap.kriz.filter((k, i) => k.hotovo && i <= r).length - 1] || '⭐'}</span>` : '';
            uzly.push(`<button type="button" class="dum ${stav}" data-r="${r}" data-j="${j}" style="left:${h.x}px;top:${h.y}px;--b:${M.barva};--dum:${dum}px" aria-label="${M.nazev}" ${stav === 'aktivni' ? '' : 'tabindex="-1"'}>` +
              `<svg class="strecha" viewBox="0 0 120 52" aria-hidden="true"><polygon points="60,5 116,48 4,48" fill="${M.barva}" stroke="#26244A" stroke-width="5" stroke-linejoin="round"/></svg>` +
              `<span class="telo"><span class="emo">${M.e}</span><span class="dum-postava emo">${M.post.e}</span></span><span class="jmeno">${M.nazev}</span>${odz}</button>`);
          });
          if (kr.hotovo) prev = { x: xs[kr.volba], y: hy };
          else { avatar = fork; aktivniKr = kr; budouci = true; prev = fork; }
        } else {
          cesty.push({ d: cesta(prev, { x: W / 2, y: hy }), c: 'budouci', k: kraj });
          uzly.push(`<span class="mlha emo" style="left:${W / 2}px;top:${hy}px">☁️</span>`);
          prev = { x: W / 2, y: hy }; budouci = true;
        }
        y += rowH;
      }
      const cil = { x: W / 2, y: y + 40 }, hotova = hotovych(kap) >= KRIZ;
      cesty.push({ d: cesta(prev, cil), c: budouci ? 'budouci' : 'hlavni', k: kraj });
      uzly.push(`<div class="uzel cil ${hotova ? 'hotovy' : ''}" style="left:${cil.x}px;top:${cil.y}px"><span class="emo">${K.cil}</span></div>`);
      if (ki === S.cesta.length - 1 && hotova && !avatar) avatar = cil;
      prev = cil; y += 130;
      pasy.push(Krajina.pas(K.id, top, y - top, W, seed(ki * 31 + 7)));
    });
    const H = y + 40;
    svet.style.height = H + 'px';
    svet.innerHTML = `<svg class="cesty" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true">${pasy.join('')}` +
      cesty.map(c => `<path class="okraj ${c.c}" d="${c.d}"/>`).join('') +
      cesty.map(c => `<path class="silnice ${c.c}" d="${c.d}" style="stroke:${c.k.silnice}"/>`).join('') +
      cesty.map(c => `<path class="stred ${c.c}" d="${c.d}"/>`).join('') + '</svg>' +
      uzly.join('') + '<div id="avatar" class="avatar"><span class="emo kluk">👦</span><span class="emo pes">🐕</span></div>';
    const av = $('#avatar');
    if (avatar) {
      av.style.left = avatar.x + 'px'; av.style.top = avatar.y + 'px';
      requestAnimationFrame(() => mapa.scrollTo({ top: Math.max(0, avatar.y - mapa.clientHeight * 0.35), behavior: 'smooth' }));
    }
    svet.querySelectorAll('.dum.aktivni').forEach(b => { b.onclick = () => vyberMisto(aktivniKr, +b.dataset.j, b); });
    $('#mapa-kapitola').innerHTML = `<span class="kap-nazev">${kapDef(aktualni().i).nazev}</span>` + slotyKapitoly(aktualni());
    $('#pocet-nalepek').textContent = S.nalepky.length;
    return { pauza };
  }

  function ukazMapu(veta) {
    ukaz('mapa');
    const { pauza } = renderMapa();
    if (pauza) Hlas.rekni(DB.TEXTY.pauza);
    else if (veta !== null) Hlas.rekni(veta || P.vyber(DB.TEXTY.krizovatka));
  }

  let vybiram = false;
  async function vyberMisto(kr, j, btn) {
    if (vybiram || !kr) return;
    vybiram = true;
    kr.volba = j; uloz();
    Zvuk.pop();
    const M = DB.MISTA[kr.mista[j].m];
    btn.classList.add('vybrany');
    const av = $('#avatar');
    av.classList.add('jde'); av.style.left = btn.style.left; av.style.top = btn.style.top;
    await Promise.all([Hlas.rekni(`Jdeme ${M.kam}!`), cekej(1000)]);
    vybiram = false;
    spustMisi(kr);
  }

  /* ---------- MISE ---------- */
  let UK = null;
  const stage = () => $('#stage');
  function bublina(x) { const t = textPolozek(x); if (t) $('#bublina').textContent = t; }
  function postup() {
    const p = $('#postup'); p.innerHTML = '';
    if (!UK) return;
    UK.plan.forEach((a, i) => p.appendChild(el('span', 'bod' + (i < UK.kolo ? ' plny' : i === UK.kolo ? ' ted' : ''), i < UK.kolo ? '<span class="emo">⭐</span>' : '')));
  }

  async function spustMisi(kr) {
    const M = DB.MISTA[kr.mista[kr.volba].m];
    const kap = aktualni(), K = kapDef(kap.i), tier = K.tier;
    S.dnesNove = false;
    const plan = sestavMisi(M, tier, kap.i);
    const u = UK = { kr, M, K, tier, plan, kolo: 0, chyby: 0, chybyKolo: 0, zamceno: true, stat: {} };
    krajina(K.id);
    ukaz('ukol');
    $('#uk-postava').textContent = M.post.e;
    $('#uk-misto').textContent = M.e;
    postup();
    const st = stage(); st.innerHTML = '';
    const karta = el('div', 'karta uvod-mista', `<span class="emo obri">${M.post.e}</span><span class="uvod-jmeno">${P.cap(M.post.jm)}</span><span class="emo misto-ikona">${M.e}</span>`);
    const start = el('button', 'kulate obri-tl dal', PLAY); start.type = 'button'; start.setAttribute('aria-label', 'Začít');
    st.append(karta, start);
    const vety = [{ t: M.pozdrav, v: M.post.v }, { t: M.prosba, v: M.post.v }];
    bublina(vety);
    let zacni; const kliknuto = new Promise(r => { zacni = r; });
    start.onclick = () => { Hlas.stop(); Zvuk.pop(); zacni(); };
    await Promise.race([Hlas.rekni(vety).then(ok => ok && cekej(400)), kliknuto]);
    if (UK !== u) return;
    dalsiKolo();
  }

  function kontext(u) {
    const kolo = u.kolo, a = u.plan[kolo], T = U.akty[a];
    const lvl = Math.min(typStav(a).m, strop(a, u.tier));
    return {
      stage: stage(), L: T.urovne[lvl], lvl, tier: u.tier, misto: u.M, prog: S, uloz,
      vyberNove: vyberNove(a),
      rekni: x => { bublina(x); return Hlas.rekni(x); },
      rekniKratce: t => Hlas.rekni(t),
      zamceno: () => UK !== u || u.zamceno || u.kolo !== kolo,
      aktivni: () => UK === u && u.kolo === kolo,
      cekej,
      spravne: (ok, e) => spravne(u, kolo, ok, e),
      spatne: (e, rada, hned) => spatne(u, kolo, e, rada, hned),
    };
  }

  function dalsiKolo() {
    const u = UK; if (!u) return;
    if (u.kolo >= u.plan.length) return dokonciMisi(u);
    u.zamceno = false; u.chybyKolo = 0;
    const st = stage(); st.innerHTML = ''; st.scrollTop = 0;
    st.className = 'stage akt-' + u.plan[u.kolo];
    postup();
    const a = u.plan[u.kolo], T = U.akty[a], c = kontext(u);
    let r;
    try { r = T.gen(c); u.r = r; Promise.resolve(T.render(c, r)).catch(e => { console.error(e); }); }
    catch (e) { console.error('aktivita ' + a, e); u.kolo++; return dalsiKolo(); }
    if (!r.vlastniZadani) c.rekni(r.zadani);
  }

  async function spravne(u, kolo, ok, e) {
    if (UK !== u || u.kolo !== kolo || u.zamceno) return;
    u.zamceno = true;
    const a = u.plan[kolo], s = u.stat[a] || (u.stat[a] = { kola: 0, chyby: 0, prvni: 0 });
    s.kola++; s.chyby += u.chybyKolo; if (u.chybyKolo === 0) s.prvni++;
    Zvuk.ok();
    const r = (e || stage()).getBoundingClientRect(); konfety(r.left + r.width / 2, r.top + r.height / 2);
    u.kolo++; postup();
    const vety = [P.vyber(DB.TEXTY.pochvaly), ...[ok || []].flat()];
    bublina(vety);
    await Hlas.rekni(vety);
    await cekej(400);
    if (UK === u) dalsiKolo();
  }

  function spatne(u, kolo, e, rada, hned) {
    if (UK !== u || u.kolo !== kolo || u.zamceno) return;
    u.chyby++; u.chybyKolo++;
    Zvuk.chyba();
    if (e) U.h.vrt(e);
    let vety = hned ? [hned] : [];
    if (u.chybyKolo > 1 && rada) vety = vety.concat([rada].flat());
    if (!vety.length) vety = [P.vyber(DB.TEXTY.povzbuzeni)];
    if (u.chybyKolo >= 3) { const n = stage().querySelector('[data-ok]'); if (n) n.classList.add('napoveda'); }
    bublina(vety); Hlas.rekni(vety);
  }

  async function dokonciMisi(u) {
    const kap = aktualni(), K = u.K;
    Object.entries(u.stat).forEach(([a, s]) => {
      const ts = typStav(a), st = strop(a, u.tier);
      ts.hry++; ts.kola += s.kola; ts.chyby += s.chyby; ts.prvni += s.prvni;
      if (U.akty[a].urovne.length > 1) {
        if (s.chyby === 0) ts.m = Math.min(ts.m + 1, st);
        else if (s.chyby >= 2 * s.kola + 1) ts.m = Math.max(0, ts.m - 1);
      }
    });
    if (u.plan.includes('omalovanka')) S.omal[kap.i] = true;
    S.hist.push(...u.plan); S.histMist.push(u.kr.mista[u.kr.volba].m);
    if (S.hist.length > 80) S.hist.splice(0, S.hist.length - 80);
    if (S.histMist.length > 30) S.histMist.splice(0, S.histMist.length - 30);
    u.kr.hotovo = true; S.celkem++; hlidejDen(); S.dnes++;
    const nove = DB.NALEPKY.filter(n => !S.nalepky.includes(n));
    const nalepka = nove.length ? P.vyber(nove) : '🏅';
    S.nalepky.push(nalepka);
    const predmet = K.predmety[hotovych(kap) - 1] || '⭐';
    uloz();
    UK = null;
    Zvuk.fanfara();
    setTimeout(() => konfety(innerWidth / 2, innerHeight / 3, 60), 150);
    const dek = u.M.post.v === 'z' ? DB.TEXTY.dekujiZ : DB.TEXTY.dekuji;
    await scena({ postava: u.M.post.e, jmeno: P.cap(u.M.post.jm), vety: [P.vyber(dek), DB.TEXTY.odmena],
      obsah: `<div class="odmeny"><div class="karta odmena"><span class="emo obri">${predmet}</span><span class="pod">pro slavnost</span></div>` +
        `<div class="karta odmena nalepka-nova"><span class="emo obri">${nalepka}</span><span class="pod">nálepka</span></div></div>` });
    if (hotovych(kap) >= KRIZ) {
      Zvuk.fanfara();
      setTimeout(() => konfety(innerWidth / 2, innerHeight / 3, 90), 200);
      await scena({ vety: [K.konec], obsah: `<div class="velky-cil emo">${K.cil}</div>${slotyKapitoly(kap)}` });
      S.cesta.push({ i: kap.i + 1, kriz: [], uvod: false }); uloz();
      await uvodKapitoly();
      return ukazMapu();
    }
    ukaz('mapa');
    renderMapa();
    const b = $(`.dum[data-r="${kap.kriz.indexOf(u.kr)}"][data-j="${u.kr.volba}"]`);
    if (b) {
      const av = $('#avatar'), cil = { l: av.style.left, t: av.style.top };
      av.classList.remove('jde'); av.style.left = b.style.left; av.style.top = b.style.top;
      requestAnimationFrame(() => requestAnimationFrame(() => { av.classList.add('jde'); av.style.left = cil.l; av.style.top = cil.t; }));
    }
    Hlas.rekni(S.limit > 0 && S.dnes >= S.limit ? DB.TEXTY.pauza : P.vyber(DB.TEXTY.krizovatka));
  }

  function opustMisi() {
    if (UK) { UK.kr.volba = null; uloz(); }
    UK = null; Hlas.stop();
    ukazMapu();
  }

  /* ---------- ALBUM ---------- */
  function ukazAlbum() {
    ukaz('album');
    const g = $('#album-mrizka'); g.innerHTML = '';
    DB.NALEPKY.forEach(n => {
      const ma = S.nalepky.includes(n);
      g.appendChild(el('div', 'nalepka ' + (ma ? 'ma' : 'nema'), ma ? `<span class="emo">${n}</span>` : '<span class="otaznik">?</span>'));
    });
    const zlate = S.nalepky.filter(n => n === '🏅').length;
    $('#album-pocet').textContent = `${S.nalepky.filter(n => n !== '🏅').length} / ${DB.NALEPKY.length}` + (zlate ? ` · 🏅 ${zlate}` : '');
    Hlas.rekni(DB.TEXTY.album);
  }

  /* ---------- PANEL PRO RODIČE (podržet ⚙️) ---------- */
  let resetKrok = 0;
  function panelRodice() {
    const p = $('#rodice'), kap = aktualni() || { i: 0, kriz: [] };
    const hlas = Hlas.ttsHlas ? Hlas.ttsHlas() : null;
    const hl = hlas ? `Mluví hlas <b>${hlas.name}</b>.` : 'Český hlas v zařízení nebyl nalezen.';
    const typy = Object.values(U.akty).map(T => {
      const s = S.typy[T.id]; if (!s || !s.kola) return '';
      return `<tr><td>${T.nazev}</td><td>${s.m + 1} / ${T.urovne.length}</td><td>${s.kola}</td><td>${Math.round(100 * s.prvni / s.kola)} %</td></tr>`;
    }).join('');
    const pismena = DB.PISMENA.slice(0, S.pismena).map(x => x.p).join(' ') || '–';
    p.innerHTML = `<div class="rodice" role="dialog" aria-label="Pro rodiče">
      <h2>Pro rodiče</h2>
      <p>Kapitola: <b>${kapDef(kap.i).nazev}</b> · úkol ${Math.min(hotovych(kap) + 1, KRIZ)} z ${KRIZ} · splněno celkem ${S.celkem} · dnes ${S.dnes}</p>
      <p>Naučená písmenka: <b class="pismo-mini">${pismena}</b></p>
      ${typy ? `<div class="tab-obal"><table><thead><tr><th>Aktivita</th><th>Úroveň</th><th>Kol</th><th>Napoprvé</th></tr></thead><tbody>${typy}</tbody></table></div>` : '<p class="maly">Statistiky se objeví po první misi.</p>'}
      <div class="radek"><span>Hlas</span><label class="prepinac"><input type="checkbox" id="chk-hlas" ${S.hlas ? 'checked' : ''}> mluví nahlas</label></div>
      <p class="maly">${hl} Lepší hlas na iPadu: Nastavení → Přístupnost → Předčítaný obsah → Hlasy → Čeština → stáhnout Zuzana (vylepšená nebo prémiová).</p>
      <div class="radek"><span>Denní limit misí</span><span class="krok"><button type="button" class="mini" id="lim-minus">−</button><b>${S.limit || 'bez limitu'}</b><button type="button" class="mini" id="lim-plus">+</button></span></div>
      <p class="maly">Postup se ukládá jen v tomto prohlížeči. Na plochu iPadu: Safari → Sdílet → Přidat na plochu.</p>
      <div class="tlacitka">
        <button type="button" class="karta tl" id="btn-preskoc">Přeskočit kapitolu</button>
        <button type="button" class="karta tl" id="btn-reset">Smazat postup</button>
        <button type="button" class="karta tl zelene" id="btn-zavrit">Zavřít</button>
      </div></div>`;
    $('#chk-hlas').onchange = e => { S.hlas = e.target.checked; Hlas.zapnuto = S.hlas; uloz(); };
    $('#lim-minus').onclick = () => { S.limit = Math.max(0, (S.limit || 0) - 1); uloz(); panelRodice(); };
    $('#lim-plus').onclick = () => { S.limit = (S.limit || 0) + 1; uloz(); panelRodice(); };
    $('#btn-preskoc').onclick = () => { if (!S.cesta.length) return; const k = aktualni(); S.cesta.push({ i: k.i + 1, kriz: [], uvod: true }); uloz(); p.hidden = true; ukazMapu(); };
    const rb = $('#btn-reset');
    rb.onclick = () => {
      if (!resetKrok) { resetKrok = 1; rb.textContent = 'Opravdu? Ťukněte znovu'; setTimeout(() => { resetKrok = 0; if (rb.isConnected) rb.textContent = 'Smazat postup'; }, 3500); return; }
      resetKrok = 0; S = novyStav(); uloz(); p.hidden = true; ukaz('start');
    };
    $('#btn-zavrit').onclick = () => { p.hidden = true; if (!$('#obr-mapa').hidden) renderMapa(); };
    p.hidden = false;
  }
  function drzeni(b) {
    let t = null;
    const stop = () => { clearTimeout(t); b.classList.remove('drzim'); };
    b.addEventListener('pointerdown', e => { e.preventDefault(); b.classList.add('drzim'); t = setTimeout(() => { stop(); panelRodice(); }, 1000); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, stop));
    b.addEventListener('contextmenu', e => e.preventDefault());
    b.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); panelRodice(); } });
  }

  /* ---------- start ---------- */
  async function hraj() {
    Hlas.odemkni();
    Hlas.zapnuto = S.hlas;
    if (!S.cesta.length) { S.cesta.push({ i: 0, kriz: [], uvod: false }); uloz(); }
    if (!aktualni().uvod) await uvodKapitoly();
    ukazMapu(S.celkem ? DB.TEXTY.pokracujem : undefined);
  }

  document.addEventListener('DOMContentLoaded', () => {
    $('#btn-hraj').onclick = hraj;
    $('#btn-album').onclick = ukazAlbum;
    $('#album-zpet').onclick = () => ukazMapu(null);
    $('#uk-mapa').onclick = opustMisi;
    $('#uk-opakuj').onclick = () => { if (UK && UK.r && !UK.zamceno) Hlas.rekni([UK.r.zadani].flat().slice(UK.r.vlastniZadani ? 1 : 0)); };
    document.querySelectorAll('.rodic').forEach(drzeni);
    document.addEventListener('pointerdown', () => { Hlas.odemkni(); try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {} }, { once: true });
    let rt = null;
    window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (!$('#obr-mapa').hidden) renderMapa(); }, 200); });
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    // jako aplikace na ploše: uložit hru do zařízení, aby šla i bez internetu
    if ('serviceWorker' in navigator && document.querySelector('link[rel="manifest"]') && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
    $('#start-pokrok').textContent = S.celkem ? `Splněno misí: ${S.celkem} · nálepek: ${S.nalepky.length}` : '';
    ukaz('start');
    if (location.hash === '#test') window.MESTECKO_TEST = { dalsi() { if (UK) { UK.kolo++; dalsiKolo(); } }, plan: () => UK && UK.plan };
  });
})();

</script>
</body>
</html>
